name: firebase_messaging
description: >
  Android-only fork of firebase_messaging for Vigia. Keeps FCM on Android while
  preventing the Firebase iOS SDK from being linked into iPhone builds.
version: 16.5.0
publish_to: none
homepage: https://firebase.google.com/docs/cloud-messaging

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  firebase_core: ^4.13.0
  firebase_core_platform_interface: ^8.1.0
  firebase_messaging_platform_interface: ^4.9.3
  flutter:
    sdk: flutter
  meta: ^1.8.0

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.firebase.messaging
        pluginClass: FlutterFirebaseMessagingPlugin
