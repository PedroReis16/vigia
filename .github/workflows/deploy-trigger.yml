name: Vigia — Deploy Trigger

# Prevent concurrent deploys — queue instead of cancel.
concurrency:
  group: deploy-trigger-${{ inputs.project }}-${{ inputs.version }}
  cancel-in-progress: false

run-name: "${{ inputs.project }} — deploy v${{ inputs.version }} → production"

# ─────────────────────────────────────────────────────────────────
# Como este workflow se encaixa no pipeline de release:
#
#   <project>-deploy.yml →  valida, testa, analisa segurança, faz o
#                          build/push do artefato e cria a GitHub
#                          Release com tag padronizada
#                          ('<project>@X.Y.Z'). Cada projeto possui
#                          seu próprio workflow de release:
#                            • vigia-api            → service-deploy.yml
#                            • vigia-ui             → mobile-deploy.yml
#                            • vigia-fall-detection → onboard-deploy.yml
#
#   deploy-trigger.yml  →  recebe o par (projeto, versão), valida
#                          que a Release '<project>@<version>'
#                          existe e dispara o deploy do projeto
#                          escolhido para o ambiente de produção.
#
# A GitHub Release é o contrato: ela só existe quando todos os gates
# de qualidade passaram e o artefato está publicado. Este workflow
# confia nesse contrato — não reconstrói nem re-publica artefatos.
#
# OBS.: atualmente apenas o projeto 'vigia-api' possui fluxo de deploy
# automatizado implementado neste workflow. As demais opções já
# constam no input para padronização, mas falham com mensagem clara
# até que seus respectivos jobs de deploy sejam estruturados.
# ─────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Projeto para deploy"
        required: true
        type: choice
        options:
          - vigia-api
          - vigia-ui
          - vigia-fall-detection
      version:
        description: "Versão para deploy — deve ter uma GitHub Release (ex: 1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write  # registro de Deployments no GitHub para audit trail

env:
  # Tag padronizada do release ('<project>@<version>') — gerada por todos
  # os workflows de release do monorepo. É o contrato consumido aqui.
  TAG: ${{ inputs.project }}@${{ inputs.version }}
  # Imagem Docker correspondente ao projeto. Relevante apenas para
  # projetos que publicam imagens no Docker Hub (atualmente: vigia-api).
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.project }}
  # Nome do serviço no docker-compose.yaml de produção.
  # Vinculado ao vigia-api por enquanto (único deploy via SSH/EC2).
  SERVICE: vigia

jobs:

  # ═══════════════════════════════════════════════════════════════
  # 1. VALIDATE DEPLOY
  #    Garante que a versão está pronta para deploy:
  #      - Projeto possui fluxo de deploy implementado neste workflow
  #      - GitHub Release '<project>@<version>' existe (todos os gates
  #        CI/CD passaram no workflow de release do projeto)
  #      - Para projetos baseados em imagem Docker: imagem disponível
  #        no Docker Hub
  #    Cria um registro de Deployment no GitHub para audit trail.
  # ═══════════════════════════════════════════════════════════════
  validate_deploy:
    name: Validate — release e imagem disponíveis
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.create_deployment.outputs.deployment_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # ── Gate de projeto suportado ──────────────────────────────────────
      # Apenas 'vigia-api' tem fluxo de deploy automatizado hoje.
      # Os demais projetos já constam no input para padronização, mas
      # falham aqui (antes de qualquer side-effect, como criação do
      # registro de Deployment) com mensagem explícita.
      - name: Verificar projeto suportado neste workflow
        run: |
          set -euo pipefail
          PROJECT="${{ inputs.project }}"
          case "$PROJECT" in
            vigia-api)
              echo "✓ Projeto '$PROJECT' suportado por este workflow."
              ;;
            vigia-ui|vigia-fall-detection)
              echo "::error::O fluxo de deploy automatizado para o projeto '$PROJECT' ainda não foi implementado neste workflow."
              echo "Atualmente apenas 'vigia-api' possui pipeline de deploy estruturado."
              echo "TODO: estruturar o deploy de '$PROJECT' em um job dedicado."
              exit 1
              ;;
            *)
              echo "::error::Projeto desconhecido: '$PROJECT'."
              exit 1
              ;;
          esac

      # A GitHub Release só existe após o workflow de release do projeto
      # concluir com sucesso (testes, segurança, build, push do artefato).
      # É o sinal de "pronto para deploy".
      - name: Verificar GitHub Release existe
        run: |
          set -euo pipefail
          if ! gh release view "${{ env.TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release '${{ env.TAG }}' não encontrada."
            echo "Execute o workflow de release de '${{ inputs.project }}' com version '${{ inputs.version }}' primeiro."
            exit 1
          fi
          echo "✓ Release '${{ env.TAG }}' encontrada — versão pronta para deploy."

      - name: Verificar imagem disponível no Docker Hub
        run: |
          set -euo pipefail
          if ! docker manifest inspect "${{ env.IMAGE }}:${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Imagem '${{ env.IMAGE }}:${{ inputs.version }}' não encontrada no Docker Hub."
            echo "Verifique se o job 'publish' do workflow de release de '${{ inputs.project }}' concluiu com sucesso."
            exit 1
          fi
          echo "✓ Imagem '${{ env.IMAGE }}:${{ inputs.version }}' disponível."

      # Registra o deploy no sistema nativo de Deployments do GitHub.
      # Cria audit trail visível na aba "Environments" do repositório.
      - name: Criar registro de Deployment no GitHub
        id: create_deployment
        run: |
          set -euo pipefail
          DEPLOYMENT_ID=$(gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments" \
            -f ref="${{ github.ref }}" \
            -f environment="production" \
            -f description="Deploy ${{ inputs.project }} v${{ inputs.version }}" \
            -F auto_merge=false \
            -F required_contexts='[]' \
            --jq '.id')
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "✓ Deployment registrado: ID=$DEPLOYMENT_ID"

  # ═══════════════════════════════════════════════════════════════
  # 2. DEPLOY
  #    Conecta via SSH ao servidor de produção e atualiza o serviço.
  #    Atualmente implementado apenas para o projeto 'vigia-api'.
  #    O gate em validate_deploy garante que apenas projetos com
  #    fluxo estruturado cheguem até este job.
  #
  #    Fluxo (vigia-api):
  #      1. Salva versão anterior para possível rollback
  #      2. Atualiza VIGIA_API_IMAGE_TAG no .env
  #      3. Faz pull da nova imagem
  #      4. Reinicia o serviço via docker compose
  #      5. Aguarda estabilização e valida via health check HTTP
  #      6. Rollback automático se o serviço não responder
  #    Atualiza o status do Deployment no GitHub em caso de sucesso ou falha.
  #
  #    TODO: ao estruturar o deploy de 'vigia-ui' e 'vigia-fall-detection',
  #          considerar quebrar este job em jobs específicos por projeto
  #          (ex.: deploy_vigia_api / deploy_vigia_ui / deploy_fall_detection)
  #          gated por `if: inputs.project == '<project>'`.
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy → production
    needs: validate_deploy
    runs-on: ubuntu-latest
    # O ambiente "production" permite secrets específicos de ambiente
    # e revisores obrigatórios nas configurações do repositório.
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOYMENT_ID: ${{ needs.validate_deploy.outputs.deployment_id }}
    steps:
      - name: Marcar deployment como em andamento
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="in_progress" \
            -f description="Deploy ${{ inputs.project }} v${{ inputs.version }} iniciado"

      - name: Deploy via SSH
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_SERVER_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            SERVICE="vigia"
            VERSION="${{ inputs.version }}"
            DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH }}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/vigia-api"
            HEALTH_URL="http://localhost:8000/health"

            echo "==> Deploy de vigia-api v$VERSION"
            cd "$DEPLOY_PATH"

            # ── Salvar versão anterior para rollback ──────────────────────────
            PREV_VERSION=$(grep "^VIGIA_API_IMAGE_TAG=" .env 2>/dev/null | cut -d= -f2 || echo "")
            echo "==> Versão anterior: ${PREV_VERSION:-<não registrada>}"

            # ── Atualizar versão no .env ──────────────────────────────────────
            # docker-compose.yaml lê VIGIA_API_IMAGE_TAG para montar a tag da imagem.
            if [ -f .env ] && grep -q "^VIGIA_API_IMAGE_TAG=" .env; then
              sed -i "s/^VIGIA_API_IMAGE_TAG=.*/VIGIA_API_IMAGE_TAG=$VERSION/" .env
            else
              echo "VIGIA_API_IMAGE_TAG=$VERSION" >> .env
            fi
            echo "==> VIGIA_API_IMAGE_TAG → $VERSION"

            # ── Pull da nova imagem ───────────────────────────────────────────
            echo "==> Baixando imagem $IMAGE:$VERSION ..."
            docker pull "$IMAGE:$VERSION"

            # ── Subir nova versão ─────────────────────────────────────────────
            echo "==> Reiniciando serviço '$SERVICE' ..."
            docker compose up -d --remove-orphans "$SERVICE"

            # ── Health check HTTP ─────────────────────────────────────────────
            echo "==> Aguardando serviço responder em $HEALTH_URL ..."
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -sf --max-time 5 "$HEALTH_URL" >/dev/null 2>&1; then
                HEALTHY=true
                echo "✓ Serviço respondeu após $((i * 5))s."
                break
              fi
              echo "  tentativa $i/12 — aguardando 5s ..."
              sleep 5
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "::error::Serviço não respondeu em 60s. Iniciando rollback ..."
              docker compose logs --tail=100 "$SERVICE" || true

              # ── Rollback ──────────────────────────────────────────────────
              if [ -n "$PREV_VERSION" ]; then
                echo "==> Revertendo para $PREV_VERSION ..."
                sed -i "s/^VIGIA_API_IMAGE_TAG=.*/VIGIA_API_IMAGE_TAG=$PREV_VERSION/" .env
                docker compose up -d --remove-orphans "$SERVICE"

                for i in $(seq 1 6); do
                  if curl -sf --max-time 5 "$HEALTH_URL" >/dev/null 2>&1; then
                    echo "✓ Rollback concluído — serviço estável em v$PREV_VERSION."
                    break
                  fi
                  sleep 5
                done
                echo "::warning::Rollback executado para v$PREV_VERSION. Verifique os logs acima."
              else
                echo "::warning::Sem versão anterior registrada — rollback não executado."
              fi

              exit 1
            fi

            # ── Limpeza de imagens obsoletas ──────────────────────────────────
            echo "==> Removendo imagens antigas de vigia-api ..."
            docker images "$IMAGE" --format "{{.Tag}}" \
              | grep -v "^$VERSION$" \
              | grep -v "^latest$" \
              | xargs -r -I{} docker rmi "$IMAGE:{}" 2>/dev/null || true

            echo "==> Deploy de vigia-api v$VERSION concluído com sucesso."

      - name: Marcar deployment como sucesso
        if: success()
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="success" \
            -f description="${{ inputs.project }} v${{ inputs.version }} em produção"

      - name: Marcar deployment como falha
        if: failure()
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="failure" \
            -f description="Deploy ${{ inputs.project }} v${{ inputs.version }} falhou — verifique os logs"
