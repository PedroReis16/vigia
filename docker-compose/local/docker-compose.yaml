services:
  # ─── POSTGRES ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: vigia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=vigia
      - POSTGRES_PASSWORD=vigia123
      - POSTGRES_DB=vigia
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigia-network

  # ─── RABBITMQ ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: vigia-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: vigia
      RABBITMQ_DEFAULT_PASS: vigia123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - vigia-network

  # ─── MAILHOG (SMTP local do fluxo de autenticação) ─────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: vigia-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (Keycloak na rede usa mailhog:1025)
      - "8025:8025" # UI http://localhost:8025
    networks:
      - vigia-network

  # ─── KEYCLOAK ─────────────────────────────────────────────────────────────
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    image: vigia-keycloak:local
    container_name: keycloak
    restart: unless-stopped
    # --import-realm lê /opt/keycloak/data/import/*-realm.json só se o realm ainda não existir
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/vigia?currentSchema=keycloak
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: senha_forte
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Traefik encaminha /auth sem strip; o console usa o Host da requisição (localhost e :81)
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_SPI_EVENTS_LISTENER_VIGIA_WEBHOOK_HOST: rabbitmq
      KC_SPI_EVENTS_LISTENER_VIGIA_WEBHOOK_PORT: "5672"
      KC_SPI_EVENTS_LISTENER_VIGIA_WEBHOOK_USERNAME: vigia
      KC_SPI_EVENTS_LISTENER_VIGIA_WEBHOOK_PASSWORD: vigia123
      KC_SPI_EVENTS_LISTENER_VIGIA_WEBHOOK_EXCHANGE: vigia.users.direct_exchange
      KC_SPI_EVENTS_LISTENER_VIGIA_WEBHOOK_ROUTING_KEY: users.sync
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/themes/vigia:/opt/keycloak/themes/vigia:ro
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/vigia-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`host.docker.internal`) || HostRegexp(`^[0-9.]+$`)) && PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.priority=40"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    networks:
      - vigia-network

  # Reaplica SMTP e o perfil de usuário (phone) no realm vigia: --import-realm ignora realm que já existe.
  keycloak-realm-smtp:
    image: vigia-keycloak:local
    container_name: keycloak-realm-smtp
    restart: "no"
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_URL: http://keycloak:8080/auth
    entrypoint: ["/bin/bash", "/apply-smtp.sh"]
    volumes:
      - ./keycloak/apply-smtp.sh:/apply-smtp.sh:ro
      - ./keycloak/user-profile.json:/user-profile.json:ro
    networks:
      - vigia-network

  # ─── REDIS ────────────────────────────────────────────────────────────────
  redis:
    image: redis:latest
    container_name: vigia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigia-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: vigia-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      - vigia-network
    depends_on:
      - redis

  # ─── Minio ────────────────────────────────────────────────────────────────
  minio:
    image: pedroreis16/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - ./minio_data:/data
    command: server --console-address ":9001" /data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigia-network

  # ─── VIGIA API (.NET) ─────────────────────────────────────────────────────
  vigia-api:
    build:
      context: ../..
      dockerfile: docker-compose/dockerfiles/vigia-api.dockerfile
      args:
        # DEBUG habilita seed do device de teste + EnsureSeedDeviceAsync no FiwareServiceJob
        BUILD_CONFIGURATION: Debug
    image: vigia-api:local
    container_name: vigia-api
    restart: unless-stopped
    env_file:
      - default.env
    ports:
      - "8090:8080"
    volumes:
      - vigia-api-versions:/versions
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vigia-api.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`host.docker.internal`) || HostRegexp(`^[0-9.]+$`)) && PathPrefix(`/vigia`)"
      - "traefik.http.routers.vigia-api.entrypoints=web"
      - "traefik.http.routers.vigia-api.priority=50"
      - "traefik.http.routers.vigia-api.middlewares=cors@file"
      - "traefik.http.services.vigia-api.loadbalancer.server.port=8080"
    networks:
      - vigia-network

  # ─── VIGIA WEB (Angular SPA) ──────────────────────────────────────────────
  # vigia-web:
  #   build:
  #     context: ../..
  #     dockerfile: docker-compose/dockerfiles/vigia-web.dockerfile
  #     args:
  #       NG_CONFIGURATION: development
  #   image: vigia-web:local
  #   container_name: vigia-web
  #   restart: unless-stopped
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.vigia-web.rule=Host(`localhost`) || Host(`127.0.0.1`) || Host(`host.docker.internal`) || HostRegexp(`^[0-9.]+$`)"
  #     - "traefik.http.routers.vigia-web.entrypoints=web"
  #     - "traefik.http.routers.vigia-web.priority=1"
  #     - "traefik.http.services.vigia-web.loadbalancer.server.port=80"
  #   networks:
  #     - vigia-network

  # ─── TRAEFIK ──────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "81:80" # ApiUrls.Fiware → http://host.docker.internal:81/vigia/fiware/
      - "443:443"
      - "1883:1883"
      # RTMP ingest fica no MediaMTX (porta 1935), não no Traefik
      - "8080:8080"
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - vigia-network

  # ─── MONGO HISTÓRICO (STH-Comet) ─────────────────────────────────────────
  mongo-db-historical:
    image: mongo:6.0
    container_name: fiware-mongo-historical
    restart: always
    hostname: mongo-db-historical
    ports:
      - "27077:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    command: ["mongod", "--nojournal", "--auth"]
    volumes:
      - mongo-historical-data:/data/db
    networks:
      - vigia-network

  # ─── MONGO INTERNO (Orion + IoT Agent) ────────────────────────────────────
  mongo-db-internal:
    image: mongo:6.0
    container_name: fiware-mongo-internal
    restart: always
    hostname: mongo-db-internal
    ports:
      - "27067:27017"
    command: ["mongod", "--nojournal"]
    volumes:
      - mongo-internal-data:/data/db
    networks:
      - vigia-network

  # ─── ORION ────────────────────────────────────────────────────────────────
  orion:
    image: fiware/orion:3.11.0
    platform: linux/amd64 # imagem oficial só amd64; no Mac ARM roda via emulação
    restart: always
    container_name: fiware-orion
    hostname: orion
    depends_on:
      - mongo-db-historical
      - traefik
    expose:
      - "1026"
    command: >
      -dbhost mongo-db-historical
      -dbuser admin
      -dbpwd admin123
      -dbAuthDb admin
      -corsOrigin __ALL
      -corsMaxAge 600
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orion.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`host.docker.internal`) || HostRegexp(`^[0-9.]+$`)) && PathPrefix(`/vigia/fiware/orion`)"
      - "traefik.http.routers.orion.entrypoints=web"
      - "traefik.http.services.orion.loadbalancer.server.port=1026"
      - "traefik.http.routers.orion.middlewares=strip-orion,cors@file"
      - "traefik.http.middlewares.strip-orion.stripprefix.prefixes=/vigia/fiware/orion"
    networks:
      - vigia-network

  # ─── STH-COMET ────────────────────────────────────────────────────────────
  sth-comet:
    image: telefonicaiot/fiware-sth-comet
    platform: linux/amd64 # imagem oficial só amd64; no Mac ARM roda via emulação
    restart: always
    container_name: fiware-sth-comet
    hostname: sth-comet
    depends_on:
      - mongo-db-historical
      - traefik
    expose:
      - "8666"
    environment:
      - STH_HOST=0.0.0.0
      - STH_PORT=8666
      - DB_PREFIX=sth_
      - DB_URI=mongo-db-historical:27017
      - DB_USERNAME=admin
      - DB_PASSWORD=admin123
      - DB_AUTH_SOURCE=admin
      - LOGOPS_LEVEL=DEBUG
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sth.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`host.docker.internal`) || HostRegexp(`^[0-9.]+$`)) && PathPrefix(`/vigia/fiware/sth-comet`)"
      - "traefik.http.routers.sth.entrypoints=web"
      - "traefik.http.services.sth.loadbalancer.server.port=8666"
      - "traefik.http.routers.sth.middlewares=strip-sth,cors@file"
      - "traefik.http.middlewares.strip-sth.stripprefix.prefixes=/vigia/fiware/sth-comet"
    networks:
      - vigia-network

  # ─── IOT AGENT ────────────────────────────────────────────────────────────
  iot-agent:
    image: fiware/iotagent-ul:latest
    platform: linux/amd64 # imagem oficial só amd64; no Mac ARM roda via emulação
    restart: always
    container_name: fiware-iot-agent
    hostname: iot-agent
    depends_on:
      - mongo-db-internal
      - mosquitto
      - traefik
    expose:
      - "4041"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_CB_NGSI_VERSION=v2
      - IOTA_NORTH_PORT=4041
      - IOTA_MONGO_HOST=mongo-db-internal
      - IOTA_MONGO_PORT=27017
      - IOTA_MQTT_HOST=mosquitto
      - IOTA_MQTT_PORT=1883
      - IOTA_LOG_LEVEL=DEBUG
      - IOTA_TIMESTAMP=true
      - IOTA_AUTOCAST=true
      - IOTA_PROVIDER_URL=http://iot-agent:4041
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iot.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`host.docker.internal`) || HostRegexp(`^[0-9.]+$`)) && PathPrefix(`/vigia/fiware/iot`)"
      - "traefik.http.routers.iot.entrypoints=web"
      - "traefik.http.services.iot.loadbalancer.server.port=4041"
      - "traefik.http.routers.iot.middlewares=strip-iot,cors@file"
      # Strip só /fiware para preservar /iot/... esperado pelo IoT Agent (ex: /iot/about)
      - "traefik.http.middlewares.strip-iot.stripprefix.prefixes=/vigia/fiware"
    networks:
      - vigia-network

  # ─── MOSQUITTO (MQTT) ─────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:latest
    restart: always
    container_name: fiware-mosquitto
    hostname: mosquitto
    expose:
      - "1883"
      - "9001"
    depends_on:
      - traefik
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mqttws.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`host.docker.internal`) || HostRegexp(`^[0-9.]+$`)) && PathPrefix(`/vigia/fiware/mosquitto`)"
      - "traefik.http.routers.mqttws.entrypoints=web"
      - "traefik.http.services.mqttws.loadbalancer.server.port=9001"
      - "traefik.http.middlewares.strip-notifications.stripprefix.prefixes=/vigia/fiware/mosquitto"
      - "traefik.http.routers.mqttws.middlewares=strip-notifications,cors@file"
    networks:
      - vigia-network

  #  ──  MEDIAMTX (VIDEO STREAMING) ───────────────────────────────────────────────────

  mediamtx:
    # Official image is scratch (no curl/sh/jq). Build adds Alpine for runOnUnread hooks.
    build:
      context: ..
      dockerfile: dockerfiles/mediamtx.dockerfile
    image: vigia-mediamtx:local
    container_name: mediamtx
    restart: unless-stopped
    depends_on:
      - vigia-api
    environment:
      # API in compose (vigia-api). Token = MediaMTX:WebhookToken.
      VIGIA_API_BASE: http://vigia-api:8080
      VIGIA_MEDIAMTX_TOKEN: dev-mediamtx-webhook-token
      UNDEMAND_GRACE_SECONDS: "3"
    ports:
      # Ingest RTMP direto (mais estável que TCP proxy do Traefik)
      - "1935:1935"
      # WebRTC ICE/RTP — obrigatório para o vídeo não ficar preto no browser
      - "8189:8189/udp"
      - "8189:8189/tcp"
      # HLS (alternativa HTTP)
      - "8888:8888"
    labels:
      - "traefik.enable=true"
      # Playback WebRTC (signaling HTTP). Mídia usa :8189 no host.
      - "traefik.http.routers.mediamtx-play.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`host.docker.internal`) || HostRegexp(`^[0-9.]+$`)) && PathPrefix(`/live`)"
      - "traefik.http.routers.mediamtx-play.entrypoints=web"
      - "traefik.http.routers.mediamtx-play.priority=100"
      - "traefik.http.services.mediamtx-play.loadbalancer.server.port=8889"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ../mediamtx-hooks/on_unread_stop_streaming.sh:/hooks/on_unread_stop_streaming.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vigia-network

volumes:
  mongo-historical-data:
  mongo-internal-data:
  vigia-api-versions:

networks:
  vigia-network:
    name: vigia-network
    driver: bridge
