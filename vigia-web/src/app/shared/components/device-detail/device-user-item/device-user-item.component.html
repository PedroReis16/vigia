<div class="device-user-item">
  <div class="device-user-item__avatar" aria-hidden="true">
    @if (user().userPictureUrl && !imageFailed()) {
      <img [src]="user().userPictureUrl" [alt]="user().name" (error)="onImageError()" />
    } @else {
      <i class="pi pi-user"></i>
    }
  </div>
  <div class="device-user-item__info">
    <span class="device-user-item__name">{{ user().name }}</span>
    @if (user().isOwner) {
      <span class="device-user-item__badge">{{ 'DEVICES.USERS.OWNER' | translate }}</span>
    }
  </div>
  @if (showAction() && actionIcon()) {
    <button
      type="button"
      class="device-user-item__action"
      (click)="onAction($event)"
      [attr.aria-label]="
        actionIcon() === 'leave'
          ? ('DEVICES.USERS.LEAVE_ACTION' | translate)
          : ('DEVICES.USERS.REMOVE_ACTION' | translate)
      "
    >
      @switch (actionIcon()) {
        @case ('remove') {
          <i class="pi pi-user-minus" aria-hidden="true"></i>
        }
        @case ('leave') {
          <i class="pi pi-sign-out" aria-hidden="true"></i>
        }
        @case ('arrow') {
          <i class="pi pi-chevron-right" aria-hidden="true"></i>
        }
      }
    </button>
  }
</div>
