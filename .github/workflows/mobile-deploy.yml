name: Mobile Deploy

# Impede dois deploys simultâneos do mesmo serviço
concurrency:
    group: deploy-Mobile-${{ inputs.version }}
    cancel-in-progress: false   # false = espera o anterior terminar, não cancela
  
run-name: "Mobile deploy - v${{ inputs.version }}"

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Version to deploy"
                required: true
                type: string

permissions:
    contents: write
    pull-requests: read
    security-events: write
    

jobs:
    validate_environment:
        name: Validate environment
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

