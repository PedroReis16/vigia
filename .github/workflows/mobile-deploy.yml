  #         path: ${{ env.SERVICE_PATH }}/build/app/outputs/flutter-apk/app-release.apk
  #
  # optional_device_farm:
  #   name: Device farm (Firebase Test Lab) — FUTURO
  #   needs: [build_apk, integration_tests]
