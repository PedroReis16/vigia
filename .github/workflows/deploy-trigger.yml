name: Vigia API — Deploy Trigger

# Prevent concurrent deploys — queue instead of cancel.
concurrency:
  group: deploy-trigger-vigia-api-${{ inputs.version }}
  cancel-in-progress: false

run-name: "Vigia API — deploy v${{ inputs.version }} → production"

# ─────────────────────────────────────────────────────────────────
# Como este workflow se encaixa no pipeline de release:
#
#   service-deploy.yml  →  valida, testa, analisa segurança, faz o
#                          build e push da imagem Docker para o Hub,
#                          e cria a GitHub Release (vigia-api@X.Y.Z)
#   deploy-trigger.yml  →  valida que a release existe (imagem já no
#                          Hub), atualiza a versão no servidor via SSH
#
# A GitHub Release é o contrato: ela só existe quando todos os gates
# de qualidade passaram e a imagem está publicada. Este workflow
# confia nesse contrato — não reconstrói nem re-publica a imagem.
# ─────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para deploy — deve ter uma GitHub Release (ex: 1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write  # registro de Deployments no GitHub para audit trail

env:
  TAG: vigia-api@${{ inputs.version }}
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vigia-api
  SERVICE: vigia  # nome do serviço no docker-compose.yaml de produção

jobs:

  # ═══════════════════════════════════════════════════════════════
  # 1. VALIDATE DEPLOY
  #    Garante que a versão está pronta para deploy:
  #      - GitHub Release existe (prova que todos os gates CI/CD passaram)
  #      - Imagem Docker disponível no Docker Hub
  #    Cria um registro de Deployment no GitHub para audit trail.
  # ═══════════════════════════════════════════════════════════════
  validate_deploy:
    name: Validate — release e imagem disponíveis
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.create_deployment.outputs.deployment_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # A GitHub Release só existe após service-deploy.yml concluir com sucesso
      # (testes, segurança, build Docker, push para Hub). É o sinal de "pronto".
      - name: Verificar GitHub Release existe
        run: |
          set -euo pipefail
          if ! gh release view "${{ env.TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release '${{ env.TAG }}' não encontrada."
            echo "Execute 'Vigia API — Service Deploy' com version '${{ inputs.version }}' primeiro."
            exit 1
          fi
          echo "✓ Release '${{ env.TAG }}' encontrada — versão pronta para deploy."

      - name: Verificar imagem disponível no Docker Hub
        run: |
          set -euo pipefail
          if ! docker manifest inspect "${{ env.IMAGE }}:${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Imagem '${{ env.IMAGE }}:${{ inputs.version }}' não encontrada no Docker Hub."
            echo "Verifique se o job 'publish' do service-deploy.yml concluiu com sucesso."
            exit 1
          fi
          echo "✓ Imagem '${{ env.IMAGE }}:${{ inputs.version }}' disponível."

      # Registra o deploy no sistema nativo de Deployments do GitHub.
      # Cria audit trail visível na aba "Environments" do repositório.
      - name: Criar registro de Deployment no GitHub
        id: create_deployment
        run: |
          set -euo pipefail
          DEPLOYMENT_ID=$(gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments" \
            -f ref="${{ github.ref }}" \
            -f environment="production" \
            -f description="Deploy vigia-api v${{ inputs.version }}" \
            -F auto_merge=false \
            -F required_contexts='[]' \
            --jq '.id')
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "✓ Deployment registrado: ID=$DEPLOYMENT_ID"

  # ═══════════════════════════════════════════════════════════════
  # 2. DEPLOY
  #    Conecta via SSH ao servidor de produção e atualiza o serviço.
  #    Fluxo:
  #      1. Salva versão anterior para possível rollback
  #      2. Atualiza VIGIA_API_IMAGE_TAG no .env
  #      3. Faz pull da nova imagem
  #      4. Reinicia o serviço via docker compose
  #      5. Aguarda estabilização e valida via health check HTTP
  #      6. Rollback automático se o serviço não responder
  #    Atualiza o status do Deployment no GitHub em caso de sucesso ou falha.
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy → production
    needs: validate_deploy
    runs-on: ubuntu-latest
    # O ambiente "production" permite secrets específicos de ambiente
    # e revisores obrigatórios nas configurações do repositório.
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOYMENT_ID: ${{ needs.validate_deploy.outputs.deployment_id }}
    steps:
      - name: Marcar deployment como em andamento
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="in_progress" \
            -f description="Deploy vigia-api v${{ inputs.version }} iniciado"

      - name: Deploy via SSH
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_SERVER_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            SERVICE="vigia"
            VERSION="${{ inputs.version }}"
            DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH }}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/vigia-api"
            HEALTH_URL="http://localhost:8000/health"

            echo "==> Deploy de vigia-api v$VERSION"
            cd "$DEPLOY_PATH"

            # ── Salvar versão anterior para rollback ──────────────────────────
            PREV_VERSION=$(grep "^VIGIA_API_IMAGE_TAG=" .env 2>/dev/null | cut -d= -f2 || echo "")
            echo "==> Versão anterior: ${PREV_VERSION:-<não registrada>}"

            # ── Atualizar versão no .env ──────────────────────────────────────
            # docker-compose.yaml lê VIGIA_API_IMAGE_TAG para montar a tag da imagem.
            if [ -f .env ] && grep -q "^VIGIA_API_IMAGE_TAG=" .env; then
              sed -i "s/^VIGIA_API_IMAGE_TAG=.*/VIGIA_API_IMAGE_TAG=$VERSION/" .env
            else
              echo "VIGIA_API_IMAGE_TAG=$VERSION" >> .env
            fi
            echo "==> VIGIA_API_IMAGE_TAG → $VERSION"

            # ── Pull da nova imagem ───────────────────────────────────────────
            echo "==> Baixando imagem $IMAGE:$VERSION ..."
            docker pull "$IMAGE:$VERSION"

            # ── Subir nova versão ─────────────────────────────────────────────
            echo "==> Reiniciando serviço '$SERVICE' ..."
            docker compose up -d --remove-orphans "$SERVICE"

            # ── Health check HTTP ─────────────────────────────────────────────
            echo "==> Aguardando serviço responder em $HEALTH_URL ..."
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -sf --max-time 5 "$HEALTH_URL" >/dev/null 2>&1; then
                HEALTHY=true
                echo "✓ Serviço respondeu após $((i * 5))s."
                break
              fi
              echo "  tentativa $i/12 — aguardando 5s ..."
              sleep 5
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "::error::Serviço não respondeu em 60s. Iniciando rollback ..."
              docker compose logs --tail=100 "$SERVICE" || true

              # ── Rollback ──────────────────────────────────────────────────
              if [ -n "$PREV_VERSION" ]; then
                echo "==> Revertendo para $PREV_VERSION ..."
                sed -i "s/^VIGIA_API_IMAGE_TAG=.*/VIGIA_API_IMAGE_TAG=$PREV_VERSION/" .env
                docker compose up -d --remove-orphans "$SERVICE"

                for i in $(seq 1 6); do
                  if curl -sf --max-time 5 "$HEALTH_URL" >/dev/null 2>&1; then
                    echo "✓ Rollback concluído — serviço estável em v$PREV_VERSION."
                    break
                  fi
                  sleep 5
                done
                echo "::warning::Rollback executado para v$PREV_VERSION. Verifique os logs acima."
              else
                echo "::warning::Sem versão anterior registrada — rollback não executado."
              fi

              exit 1
            fi

            # ── Limpeza de imagens obsoletas ──────────────────────────────────
            echo "==> Removendo imagens antigas de vigia-api ..."
            docker images "$IMAGE" --format "{{.Tag}}" \
              | grep -v "^$VERSION$" \
              | grep -v "^latest$" \
              | xargs -r -I{} docker rmi "$IMAGE:{}" 2>/dev/null || true

            echo "==> Deploy de vigia-api v$VERSION concluído com sucesso."

      - name: Marcar deployment como sucesso
        if: success()
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="success" \
            -f description="vigia-api v${{ inputs.version }} em produção"

      - name: Marcar deployment como falha
        if: failure()
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="failure" \
            -f description="Deploy vigia-api v${{ inputs.version }} falhou — verifique os logs"
