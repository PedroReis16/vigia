logLevel: info

# Protocolos habilitados para teste de latencia
rtsp: yes
rtmp: yes
hls: yes
webrtc: yes

# Lista reduzida para evitar negociacoes desnecessarias
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# Em Docker local (macOS), anunciar hosts explicitos evita candidatos ICE invalidos.
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts:
  - stream.vigiadeteccoes.com.br

# Porta fixa de mídia WebRTC (precisa estar publicada no host — ver infra.sh).
webrtcLocalUDPAddress: :8189
# Fallback ICE por TCP para cenarios onde UDP local falha.
webrtcLocalTCPAddress: :8189

# Parametros com foco em baixa latencia no HLS (LL-HLS)
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 6

paths:
  # Device RTMP publish: rtmp://…/live/{deviceId}
  # $G1 = device UUID capturado do path.
  # The first reader (no publisher yet) runs on_demand, which asks the device to
  # publish. After runOnDemandCloseAfter with no readers, on_undemand stops it.
  "~^live/([0-9a-fA-F-]+)$":
    source: publisher
    runOnDemand: sh /hooks/on_demand_start_streaming.sh
    runOnDemandStartTimeout: 30s
    runOnDemandCloseAfter: 10s
    runOnUnDemand: sh /hooks/on_undemand_stop_streaming.sh
  all:
    source: publisher
