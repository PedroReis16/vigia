<p-confirmDialog />

<div class="edit-device-properties">
  <div class="edit-device-properties__header">
    <button type="button" class="edit-device-properties__back" (click)="onBack()">
      <i class="pi pi-arrow-left" aria-hidden="true"></i>
    </button>
    <h2 class="edit-device-properties__title">{{ device().displayName }}</h2>
  </div>

  <form class="edit-device-properties__form" [formGroup]="form" (ngSubmit)="onSave()">
    <label class="edit-device-properties__field">
      <span>{{ 'DEVICES.DETAIL.NICKNAME' | translate }}</span>
      <input pInputText formControlName="nickname" class="w-full" />
    </label>

    <label class="edit-device-properties__field">
      <span>{{ 'DEVICES.DETAIL.ROOM' | translate }}</span>
      <p-select
        formControlName="room"
        [options]="roomOptions"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'DEVICES.ROOMS.NotDefined' | translate"
        styleClass="w-full"
      >
        <ng-template #item let-option>
          {{ deviceRoomKey(option.value) | translate }}
        </ng-template>
        <ng-template #selectedItem let-option>
          {{ deviceRoomKey(option.value) | translate }}
        </ng-template>
      </p-select>
    </label>

    <div class="edit-device-properties__toggle">
      <div class="flex items-center gap-2">
        <span>{{ 'DEVICES.EDIT.SAVE_CLIPS' | translate }}</span>
        <button
          type="button"
          class="edit-device-properties__info-btn"
          [title]="'DEVICES.EDIT.CLIPS_INFO' | translate"
          (click)="clipsInfoVisible = !clipsInfoVisible"
        >
          <i class="pi pi-info-circle" aria-hidden="true"></i>
        </button>
      </div>
      <p-toggleswitch formControlName="isClipsEnabled" />
    </div>

    @if (clipsInfoVisible) {
      <p class="edit-device-properties__clips-info text-sm text-surface-600 dark:text-surface-400">
        {{ 'DEVICES.EDIT.CLIPS_INFO' | translate }}
      </p>
    }

    <p-button
      type="submit"
      class="edit-device-properties__save"
      [label]="'DEVICES.EDIT.SAVE' | translate"
      [disabled]="!hasUnsavedChanges || saving()"
      [loading]="saving()"
      styleClass="w-full"
    />
  </form>
</div>
