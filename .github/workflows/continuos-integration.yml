name: Solution Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────
  # 1. DETECÇÃO DE MUDANÇAS
  # Constrói uma matriz dinâmica com apenas os projetos
  # que tiveram arquivos alterados nesta PR.
  # ─────────────────────────────────────────────
  detect_changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      projects_matrix: ${{ steps.compute_matrix.outputs.projects_matrix }}
    steps:
      # shallow clone (fetch-depth: 1) impede o merge-base da PR; o paths-filter
      # então considera *todos* os arquivos como novos e aciona todos os filtros.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sem `token`, o paths-filter em pull_request usa git em vez da API; o diff local
      # costuma divergir do conjunto real de ficheiros da PR e pode marcar todos os filtros.
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          # "every": um ficheiro só conta se corresponder a *todos* os padrões do filtro
          # (ex.: path do projeto E não-*.md). "some" com '!' em linhas separadas trata
          # cada '!' como OR e dispara falsos positivos no repositório inteiro.
          # O quantificador é global: dockerfiles e ficheiros comuns ficam em filtros à parte.
          predicate-quantifier: every
          filters: |
            fall_detection_src:
              - 'fall-detection/**'
              - '!fall-detection/**/*.md'
            fall_detection_docker:
              - 'docker-compose/dockerfiles/fall-detection.dockerfile'
            vigia_api_src:
              - 'vigia-services/apps/vigia-api/**'
              - '!vigia-services/apps/vigia-api/**/*.md'
            vigia_api_docker:
              - 'docker-compose/dockerfiles/vigia-api.dockerfile'
            vigia_bootstrap_non_md:
              - 'vigia-services/apps/vigia-bootstrap/**'
              - '!vigia-services/apps/vigia-bootstrap/**/*.md'
            vigia_shared_non_md:
              - 'vigia-services/pkg/shared/**'
              - '!vigia-services/pkg/shared/**/*.md'
            vigia_go_work:
              - 'vigia-services/go.work'
            vigia_go_sum:
              - 'vigia-services/go.work.sum'
            vigia_makefile:
              - 'vigia-services/Makefile'
            vigia_ui_src:
              - 'vigia_ui/**'
              - '!vigia_ui/**/*.md'

      - name: Build projects matrix
        id: compute_matrix
        shell: bash
        run: |
          set -euo pipefail
          PROJECTS='[]'

          if [[ "${{ steps.filter.outputs.vigia_ui_src }}" == "true" ]]; then
            PROJECTS=$(jq -c '. + [{
              "name":       "vigia_ui",
              "type":       "flutter",
              "path":       "vigia_ui",
              "has_docker": "false"
            }]' <<< "$PROJECTS")
          fi

          if [[ "${{ steps.filter.outputs.fall_detection_src }}" == "true" || "${{ steps.filter.outputs.fall_detection_docker }}" == "true" ]]; then
            PROJECTS=$(jq -c '. + [{
              "name":       "fall-detection",
              "type":       "python",
              "path":       "fall-detection",
              "dockerfile": "docker-compose/dockerfiles/fall-detection.dockerfile",
              "has_docker": "true"
            }]' <<< "$PROJECTS")
          fi

          # Variáveis auxiliares para deixar as condições legíveis
          VIGIA_API_SRC="${{ steps.filter.outputs.vigia_api_src }}"
          VIGIA_API_DOCKER="${{ steps.filter.outputs.vigia_api_docker }}"
          VIGIA_BOOTSTRAP_CHANGED="${{ steps.filter.outputs.vigia_bootstrap_non_md }}"
          SHARED_CHANGED="${{ steps.filter.outputs.vigia_shared_non_md }}"
          GO_WORK_CHANGED="${{ steps.filter.outputs.vigia_go_work }}"
          GO_SUM_CHANGED="${{ steps.filter.outputs.vigia_go_sum }}"
          MAKEFILE_CHANGED="${{ steps.filter.outputs.vigia_makefile }}"

          # vigia-api entra se o próprio app, o pacote shared ou os arquivos
          # comuns do workspace Go foram alterados.
          if [[ "$VIGIA_API_SRC" == "true" || "$VIGIA_API_DOCKER" == "true" || "$SHARED_CHANGED" == "true" || "$GO_WORK_CHANGED" == "true" || "$GO_SUM_CHANGED" == "true" || "$MAKEFILE_CHANGED" == "true" ]]; then
            PROJECTS=$(jq -c '. + [{
              "name":       "vigia-api",
              "type":       "go",
              "path":       "vigia-services/apps/vigia-api",
              "go_mod":     "vigia-services/apps/vigia-api/go.mod",
              "go_sum":     "vigia-services/apps/vigia-api/go.sum",
              "dockerfile": "docker-compose/dockerfiles/vigia-api.dockerfile",
              "has_docker": "true"
            }]' <<< "$PROJECTS")
          fi

          if [[ "$VIGIA_BOOTSTRAP_CHANGED" == "true" || "$SHARED_CHANGED" == "true" || "$GO_WORK_CHANGED" == "true" || "$GO_SUM_CHANGED" == "true" || "$MAKEFILE_CHANGED" == "true" ]]; then
            PROJECTS=$(jq -c '. + [{
              "name":       "vigia-bootstrap",
              "type":       "go",
              "path":       "vigia-services/apps/vigia-bootstrap",
              "go_mod":     "vigia-services/apps/vigia-bootstrap/go.mod",
              "go_sum":     "vigia-services/apps/vigia-bootstrap/go.sum",
              "has_docker": "false"
            }]' <<< "$PROJECTS")
          fi

          echo "projects_matrix=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "Projetos detectados: $PROJECTS"

  # ─────────────────────────────────────────────
  # 2. SCAN DE SEGREDOS
  # Roda sempre, independente de quais projetos
  # foram alterados — segredos podem aparecer em
  # qualquer arquivo do repositório.
  # ─────────────────────────────────────────────
  secrets_scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 3. VALIDAÇÃO DE AUTORIA DE COMMITS
  # Bloqueia PRs cujos commits possuam qualquer
  # referência a agentes de IA (Cursor, Claude,
  # Copilot, Codex, ChatGPT, Gemini, etc.) em:
  #   - trailers (Co-authored-by, Made-with,
  #     Generated-with, Assisted-by, Thrilled-by,
  #     Crafted-with, Powered-by, ...);
  #   - nome ou e-mail do author/committer;
  #   - emoji 🤖 na mensagem.
  # Apenas autores humanos são permitidos.
  # ─────────────────────────────────────────────
  commit_authors_check:
    name: Commit authors validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate commits for AI agent attribution
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Garante que a base da PR está disponível localmente para o range.
          git fetch --no-tags --prune --depth=0 origin \
            "+${BASE_SHA}:refs/remotes/origin/_pr_base" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_SHA" 2>/dev/null \
            || true

          COMMITS=$(git log --format='%H' "${BASE_SHA}..${HEAD_SHA}" || true)
          if [[ -z "$COMMITS" ]]; then
            echo "Nenhum commit encontrado entre base e head — nada para validar."
            exit 0
          fi

          # Trailers/frases que atribuem a autoria (parcial ou total) a um agente.
          # Casados de forma case-insensitive contra a mensagem completa do commit.
          TRAILER_PATTERN='(co[- ]?author(ed)?[- ]?by|made[- ]?with|generated[- ]?(with|by)|assisted[- ]?by|thrilled[- ]?by|crafted[- ]?with|written[- ]?with|powered[- ]?by|authored[- ]?by|created[- ]?by|built[- ]?with).{0,80}(claude|cursor|copilot|chatgpt|openai|anthropic|codex|gemini|google[- ]?bard|\bbard\b|devin|aider|continue\.dev|sweep[- ]?ai|tabnine|amazon[- ]?q|codewhisperer|llm|\bai\b|agent)'

          # Identidades de bots/agentes em nome ou e-mail do author/committer.
          IDENTITY_PATTERN='(claude|cursor|copilot|chatgpt|openai|anthropic|codex|gemini|devin|aider|sweep[- ]?ai|tabnine|codewhisperer|\[bot\]|noreply@anthropic|@cursor\.(com|sh|so|ai)|@openai\.com|@anthropic\.com)'

          ROBOT_EMOJI=$'\xF0\x9F\xA4\x96'  # 🤖

          FAIL=0
          OFFENDING=""

          while IFS= read -r SHA; do
            [[ -z "$SHA" ]] && continue

            MSG=$(git log -1 --format='%B' "$SHA")
            AUTHOR=$(git log -1 --format='%an <%ae>' "$SHA")
            COMMITTER=$(git log -1 --format='%cn <%ce>' "$SHA")
            IDENTITY="${AUTHOR}"$'\n'"${COMMITTER}"

            REASONS=""

            if grep -qiE "$TRAILER_PATTERN" <<< "$MSG"; then
              REASONS+=$'    • Trailer/atribuição a agente de IA na mensagem.\n'
            fi

            if grep -qiE "$IDENTITY_PATTERN" <<< "$IDENTITY"; then
              REASONS+=$'    • Author/committer com identidade de agente/bot de IA.\n'
            fi

            if grep -qF "$ROBOT_EMOJI" <<< "$MSG"; then
              REASONS+=$'    • Emoji 🤖 (assinatura típica de commits gerados por IA).\n'
            fi

            if [[ -n "$REASONS" ]]; then
              FAIL=1
              OFFENDING+=$'\n  ✖ Commit '"$SHA"$'\n'
              OFFENDING+=$'      Author:    '"$AUTHOR"$'\n'
              OFFENDING+=$'      Committer: '"$COMMITTER"$'\n'
              OFFENDING+="$REASONS"
            fi
          done <<< "$COMMITS"

          if [[ "$FAIL" -eq 1 ]]; then
            {
              echo "::error::Commits com referência a agentes de IA detectados nesta PR."
              echo
              echo "Os commits desta PR devem ter apenas autores humanos."
              echo "Não são permitidas referências a Cursor, Claude, Copilot, Codex,"
              echo "ChatGPT, Gemini ou qualquer outro agente — seja como co-autor,"
              echo "trailer (Co-authored-by, Made-with, Generated-with, Assisted-by,"
              echo "Thrilled-by, ...), identidade de author/committer ou emoji 🤖."
              echo
              echo "Commits inválidos:"
              printf '%s' "$OFFENDING"
              echo
              echo "Como corrigir:"
              echo "  1. Reescreva os commits afetados (git rebase -i / git commit --amend)."
              echo "  2. Remova trailers de co-autoria e qualquer linha que mencione o agente."
              echo "  3. Faça force-push da branch da PR."
            } >&2
            exit 1
          fi

          echo "Nenhum commit com referência a agente de IA encontrado."

  # ─────────────────────────────────────────────
  # 4. QUALIDADE POR PROJETO
  # Roda em paralelo para cada projeto detectado.
  # fail-fast: false garante que todos os projetos
  # sejam verificados mesmo se um falhar.
  # ─────────────────────────────────────────────
  project_quality:
    name: "${{ matrix.project.name }} — checks"
    needs: detect_changes
    if: needs.detect_changes.outputs.projects_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect_changes.outputs.projects_matrix) }}
    steps:
      - uses: actions/checkout@v4

      # ── Setup de runtime por linguagem ──────────────────────

      - name: Set up Python
        if: matrix.project.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            ${{ matrix.project.path }}/requirements.txt
            ${{ matrix.project.path }}/requirements-debug.txt

      - name: Set up Go
        if: matrix.project.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.project.go_mod }}
          cache-dependency-path: ${{ matrix.project.go_sum }}

      - name: Set up Flutter
        if: matrix.project.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Python ──────────────────────────────────────────────

      - name: Python - install dependencies
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Mantemos compatibilidade com o workflow de deploy:
          # não instalamos requirements-debug.txt aqui para evitar
          # conflito pytest==9.x vs pytest-asyncio<9.
          python -m pip install \
            "pylint>=3,<4" \
            "bandit>=1.8,<2" \
            "pip-audit>=2.9,<3" \
            "pytest>=8.2,<9" \
            "pytest-asyncio>=0.26,<0.27"

      - name: Python - lint
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        run: python -m pylint src/app

      - name: Python - SAST
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        # -ll = reporta apenas issues de severidade MEDIUM ou acima
        run: python -m bandit -r src/app -ll

      - name: Python - dependency vulnerabilities
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        # Temporarily ignored vulnerabilities:
        # - CVE-2026-3219 (pip): no fixed version available in index yet.
        # - CVE-2025-71176 (pytest): fixed in pytest 9, but current async test stack
        #   depends on pytest-asyncio which constrains pytest<9.
        run: python -m pip_audit --strict --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2025-71176

      - name: Python - tests
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        run: python -m pytest -q

      # ── Flutter (vigia_ui) ────────────────────────────────────

      - name: Flutter - pub get
        if: matrix.project.type == 'flutter'
        working-directory: ${{ matrix.project.path }}
        run: flutter pub get

      - name: Flutter - format (obrigatório)
        if: matrix.project.type == 'flutter'
        working-directory: ${{ matrix.project.path }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter - analyze
        if: matrix.project.type == 'flutter'
        working-directory: ${{ matrix.project.path }}
        run: flutter analyze --fatal-warnings

      - name: Flutter - test
        if: matrix.project.type == 'flutter'
        working-directory: ${{ matrix.project.path }}
        run: flutter test

      # ── Go ──────────────────────────────────────────────────

      - name: Go - install security tools
        if: matrix.project.type == 'go'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Go - lint
        if: matrix.project.type == 'go'
        working-directory: ${{ matrix.project.path }}
        run: golangci-lint run --timeout=5m

      - name: Go - SAST
        if: matrix.project.type == 'go'
        working-directory: ${{ matrix.project.path }}
        run: gosec ./...

      - name: Go - dependency vulnerabilities
        if: matrix.project.type == 'go'
        working-directory: ${{ matrix.project.path }}
        run: govulncheck ./...

      - name: Go - tests with coverage
        if: matrix.project.type == 'go'
        working-directory: ${{ matrix.project.path }}
        run: |
          go test ./... \
            -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout=120s

      - name: Go - export coverage report
        if: matrix.project.type == 'go'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project.name }}
          path: ${{ matrix.project.path }}/coverage.out
          retention-days: 7

      # ── Dockerfile (qualquer linguagem que tenha imagem) ────

      - name: Dockerfile lint
        if: matrix.project.has_docker == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.project.dockerfile }}
          failure-threshold: error

  # ─────────────────────────────────────────────
  # 5. CI GATE
  # Job único que consolida o resultado de todos
  # os outros. Configure APENAS este job como
  # "required status check" no branch protection.
  #
  # Por que um gate separado?
  # O GitHub trata jobs pulados (skipped) como
  # aprovados em required checks — sem o gate,
  # uma PR que não altera nenhum projeto mapeado
  # passa o CI sem nenhuma validação real.
  # ─────────────────────────────────────────────
  ci_gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [secrets_scan, commit_authors_check, project_quality]
    # always() garante que o gate roda mesmo quando
    # project_quality foi pulado (matriz vazia).
    if: always()
    steps:
      - name: Avaliar resultado geral
        run: |
          SECRETS="${{ needs.secrets_scan.result }}"
          AUTHORS="${{ needs.commit_authors_check.result }}"
          QUALITY="${{ needs.project_quality.result }}"

          echo "secrets_scan         : $SECRETS"
          echo "commit_authors_check : $AUTHORS"
          echo "project_quality      : $QUALITY"

          if [[ "$SECRETS" == "failure" || "$SECRETS" == "cancelled" ]]; then
            echo "::error::Secret scan falhou ou foi cancelado."
            exit 1
          fi

          if [[ "$AUTHORS" == "failure" || "$AUTHORS" == "cancelled" ]]; then
            echo "::error::Validação de autoria de commits falhou: há commits referenciando agentes de IA."
            exit 1
          fi

          if [[ "$QUALITY" == "failure" || "$QUALITY" == "cancelled" ]]; then
            echo "::error::Um ou mais projetos falharam nos checks de qualidade."
            exit 1
          fi

          # "skipped" acontece quando nenhum projeto foi detectado
          # (só arquivos não mapeados foram alterados). Consideramos válido.
          # Para bloquear esse caso, troque a condição acima por:
          #   "$QUALITY" == "failure" || "$QUALITY" == "cancelled" || "$QUALITY" == "skipped"
          echo "CI concluído com sucesso."