name: Vigia - Onboard Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

run-name: "Onboard Build"

permissions:
  contents: write

env:
  SERVICE_PATH: vigia-fall
  APP_NAME: vigia-fall-detection
  # Tag/release mutável — nunca versionada; cada run sobrescreve a mesma.
  RELEASE_TAG: onboard
  ARTIFACT_NAME: vigia-fall-detection-linux-arm64
  # Nome do pacote OTA / chave rolling na API (alinhado à tag GitHub).
  OTA_PACKAGE: onboard

jobs:
  #------------------------------------------
  # 1. Build (Linux ARM64 nativo)
  #------------------------------------------
  build-release:
    name: Build - Linux ARM64
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ffmpeg \
            libglib2.0-0 \
            libgomp1 \
            libgl1 \
            libsm6 \
            libxext6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip + YOLO model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ env.SERVICE_PATH }}/yolo26s-pose.pt
          key: fall-arm64-${{ hashFiles(format('{0}/requirements.txt', env.SERVICE_PATH), format('{0}/requirements-build.txt', env.SERVICE_PATH)) }}
          restore-keys: |
            fall-arm64-

      - name: Install Python build dependencies
        run: make install-build-deps

      - name: Build Linux ARM64 bundle (native)
        env:
          VERSION: ${{ env.OTA_PACKAGE }}
        run: |
          set -euo pipefail
          echo "Host: $(uname -s)/$(uname -m)"
          make build-linux-arm64

      - name: Package OTA bundle
        env:
          VERSION: ${{ env.OTA_PACKAGE }}
        run: |
          set -euo pipefail
          make package-ota

      - name: Stage release artifacts
        env:
          OTA_PACKAGE: ${{ env.OTA_PACKAGE }}
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/release-assets"
          cp "dist/vigia-fall-ota-${OTA_PACKAGE}.tar.gz" \
             "dist/${{ env.APP_NAME }}-linux-arm64.tar.gz" \
             deploy/install.sh \
             deploy/uninstall.sh \
             deploy/fall-detection.service \
             "${{ github.workspace }}/release-assets/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/release-assets/*
          retention-days: 30

  #------------------------------------------
  # 2. Publish — mesma tag/release (rolling) + OTA API
  #------------------------------------------
  publish:
    name: Publish — tag onboard
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./artifacts

      - name: Move mutable tag to HEAD
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" -m "Vigia Onboard (rolling)"
          git push origin "refs/tags/${TAG}" --force
          echo "✓ Tag '$TAG' apontada para $(git rev-parse --short HEAD)."

      - name: Upload device package to Vigia API
        env:
          VIGIA_API_BASE_URL: ${{ secrets.VIGIA_API_BASE_URL }}
          OTA_PACKAGE: ${{ env.OTA_PACKAGE }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${VIGIA_API_BASE_URL:-}" ]; then
            echo "::error::Secret VIGIA_API_BASE_URL não configurado."
            exit 1
          fi

          BASE_URL="${VIGIA_API_BASE_URL%/}"
          ARTIFACT="./artifacts/vigia-fall-ota-${OTA_PACKAGE}.tar.gz"
          if [ ! -f "$ARTIFACT" ]; then
            echo "::error::Artefato OTA não encontrado: $ARTIFACT"
            ls -la ./artifacts || true
            exit 1
          fi

          FILE_ID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          CHUNK_SIZE=5242880
          CHUNK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHUNK_DIR"' EXIT

          split -b "$CHUNK_SIZE" -d -a 5 "$ARTIFACT" "$CHUNK_DIR/chunk_"
          mapfile -t CHUNKS < <(ls -1 "$CHUNK_DIR"/chunk_* | sort)
          TOTAL_CHUNKS="${#CHUNKS[@]}"

          if [ "$TOTAL_CHUNKS" -eq 0 ]; then
            echo "::error::Nenhum chunk gerado a partir de $ARTIFACT"
            exit 1
          fi

          echo "Enviando $ARTIFACT ($TOTAL_CHUNKS chunks) para ${BASE_URL}/devices/updates"
          echo "fileId=$FILE_ID revision=$REVISION"

          for i in "${!CHUNKS[@]}"; do
            CHUNK_PATH="${CHUNKS[$i]}"
            echo "→ Chunk $((i + 1))/$TOTAL_CHUNKS"
            curl -fsS -X POST "${BASE_URL}/devices/updates" \
              -F "fileChunk=@${CHUNK_PATH};type=application/octet-stream" \
              -F "revision=${REVISION}" \
              -F "fileId=${FILE_ID}" \
              -F "chunkIndex=${i}" \
              -F "totalChunks=${TOTAL_CHUNKS}"
            echo
          done

          echo "✓ Pacote OTA rolling enviado (revision=$REVISION)."

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vigia Onboard
          body: |
            Pacote rolling do **vigia-fall** / onboard (Linux ARM64).

            Cada execução desta pipeline sobrescreve esta release e a tag `onboard`.
            Na API o artefato OTA também é rolling (chave `onboard`); a `revision` é o SHA do commit.

            ### Instalação manual na placa
            ```bash
            scp vigia-fall-detection-linux-arm64.tar.gz install.sh uninstall.sh \
                fall-detection.service user@placa:/tmp/
            sudo /tmp/install.sh /tmp/vigia-fall-detection-linux-arm64.tar.gz
            ```
          files: |
            ./artifacts/vigia-fall-ota-${{ env.OTA_PACKAGE }}.tar.gz
            ./artifacts/${{ env.APP_NAME }}-linux-arm64.tar.gz
            ./artifacts/install.sh
            ./artifacts/uninstall.sh
            ./artifacts/fall-detection.service
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
