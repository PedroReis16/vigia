name: Vigia UI — Mobile Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

run-name: "Mobile Build"

permissions:
  contents: write
  security-events: write
  deployments: write

env:
  SERVICE_PATH: vigia_ui
  OSV_SCANNER_VERSION: v1.9.2
  # Tag/release mutável — nunca versionada; cada run sobrescreve a mesma.
  RELEASE_TAG: mobile
  APK_NAME: vigia-ui-release.apk
  ARTIFACT_NAME: vigia-ui-apk

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. PREFLIGHT — estrutura mínima (fail-fast)
  # ═══════════════════════════════════════════════════════════════════════════
  preflight:
    name: Preflight — estrutura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estrutura mínima do projeto
        run: |
          set -euo pipefail
          for f in \
            "$SERVICE_PATH/pubspec.yaml" \
            "$SERVICE_PATH/lib" \
            "$SERVICE_PATH/android/app/src/main/AndroidManifest.xml" \
            "$SERVICE_PATH/firebase.json"
          do
            if [ ! -e "$f" ]; then
              echo "::error::Arquivo/diretório obrigatório ausente: $f"
              exit 1
            fi
          done
          echo "✓ Estrutura mínima do vigia_ui ok."

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. SECURITY — varredura de secrets
  # ═══════════════════════════════════════════════════════════════════════════
  security_secrets:
    name: Security — GitLeaks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scan da árvore atual (não do histórico). Chaves antigas no git log
      # devem ser rotacionadas; purge de histórico é opcional.
      - name: GitLeaks — secret scan (working tree)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source . --redact -v --exit-code=2

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. SETUP VALIDATION — Flutter, Firebase e config Android
  # ═══════════════════════════════════════════════════════════════════════════
  setup_validation:
    name: Setup validation — Flutter, Firebase e Android config
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter — pub get
        working-directory: ${{ env.SERVICE_PATH }}
        run: flutter pub get

      - name: Flutter — versão do SDK
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          flutter --version
          dart --version

      - name: Validar firebase.json
        run: |
          set -euo pipefail
          FIREBASE_JSON="$SERVICE_PATH/firebase.json"

          jq empty "$FIREBASE_JSON" 2>/dev/null || {
            echo "::error::$FIREBASE_JSON não é um JSON válido."
            exit 1
          }

          ANDROID_APP_ID=$(jq -r '.flutter.platforms.android.default.appId // empty' "$FIREBASE_JSON")
          if [ -z "$ANDROID_APP_ID" ]; then
            echo "::error::firebase.json não contém .flutter.platforms.android.default.appId."
            exit 1
          fi

          PROJECT_ID=$(jq -r '.flutter.platforms.android.default.projectId // empty' "$FIREBASE_JSON")
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::firebase.json não contém projectId para Android."
            exit 1
          fi

          echo "✓ firebase.json válido — projectId: $PROJECT_ID | Android appId: $ANDROID_APP_ID"

      - name: Validar estratégia google-services.json e firebase_options
        run: |
          set -euo pipefail
          REAL_FILE="$SERVICE_PATH/android/app/google-services.json"
          EXAMPLE_FILE="$SERVICE_PATH/android/app/google-services.json.example"
          FIREBASE_OPTIONS="$SERVICE_PATH/lib/firebase_options.dart"
          FIREBASE_OPTIONS_EXAMPLE="$SERVICE_PATH/lib/firebase_options.dart.example"

          if [ -f "$REAL_FILE" ]; then
            echo "::error::$REAL_FILE encontrado no repositório."
            echo "Arquivo sensível não deve ser versionado — adicione ao .gitignore."
            exit 1
          fi
          echo "✓ google-services.json ausente no repositório (correto)"

          if [ ! -f "$EXAMPLE_FILE" ]; then
            echo "::warning::google-services.json.example não encontrado."
          else
            echo "✓ google-services.json.example presente"
          fi

          if git ls-files --error-unmatch "$FIREBASE_OPTIONS" >/dev/null 2>&1; then
            echo "::error::$FIREBASE_OPTIONS está versionado."
            echo "Não commite apiKeys — use firebase_options.dart.example + secret FIREBASE_OPTIONS_DART_BASE64."
            exit 1
          fi
          echo "✓ firebase_options.dart não está no índice git (correto)"

          if [ ! -f "$FIREBASE_OPTIONS_EXAMPLE" ]; then
            echo "::error::$FIREBASE_OPTIONS_EXAMPLE ausente."
            exit 1
          fi
          echo "✓ firebase_options.dart.example presente"

      - name: Dependências desatualizadas (informativo)
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          echo "==> Dependências com versões mais novas disponíveis:"
          flutter pub outdated --no-color || true
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. QUALITY — formatação e análise estática (SAST)
  # ═══════════════════════════════════════════════════════════════════════════
  quality:
    name: Quality — format e analyze
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter — pub get
        working-directory: ${{ env.SERVICE_PATH }}
        run: flutter pub get

      - name: Dart — format (obrigatório)
        working-directory: ${{ env.SERVICE_PATH }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Hidratar firebase_options.dart (example / secret)
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: bash .github/scripts/hydrate-firebase-options.sh

      - name: Flutter — analyze (SAST estático)
        working-directory: ${{ env.SERVICE_PATH }}
        run: flutter analyze --fatal-warnings

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. TESTS — testes unitários e de widget
  # ═══════════════════════════════════════════════════════════════════════════
  tests:
    name: Tests — unit e widget
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Hidratar firebase_options.dart (example / secret)
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: bash .github/scripts/hydrate-firebase-options.sh

      - name: Flutter — pub get
        working-directory: ${{ env.SERVICE_PATH }}
        run: flutter pub get

      - name: Flutter — test
        working-directory: ${{ env.SERVICE_PATH }}
        run: flutter test --reporter=expanded

  # ═══════════════════════════════════════════════════════════════════════════
  # 6. ANDROID SECURITY — manifest e permissões
  # ═══════════════════════════════════════════════════════════════════════════
  android_security:
    name: Android security — manifest e build config
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar segurança Android
        run: |
          set -euo pipefail
          MANIFEST="$SERVICE_PATH/android/app/src/main/AndroidManifest.xml"
          BUILD_GRADLE="$SERVICE_PATH/android/app/build.gradle"
          # Flutter newer projects may use .kts
          if [ ! -f "$BUILD_GRADLE" ]; then
            BUILD_GRADLE="$SERVICE_PATH/android/app/build.gradle.kts"
          fi

          if grep -Eqi 'android:debuggable[[:space:]]*=[[:space:]]*"true"' "$MANIFEST"; then
            echo "::error::android:debuggable=\"true\" encontrado no AndroidManifest."
            exit 1
          fi
          echo "✓ Manifest sem debuggable=true"

          if [ -f "$BUILD_GRADLE" ]; then
            if grep -Eqi 'debuggable[[:space:]]+[tT]rue' "$BUILD_GRADLE"; then
              echo "::error::debuggable true encontrado em $(basename "$BUILD_GRADLE")."
              exit 1
            fi
            echo "✓ Build Gradle sem debuggable true"
          else
            echo "::warning::build.gradle(.kts) não encontrado — pulando checagem de debuggable no Gradle."
          fi

          if grep -Eqi 'android:allowBackup[[:space:]]*=[[:space:]]*"true"' "$MANIFEST"; then
            echo "::warning::android:allowBackup=\"true\" no Manifest — revise se é intencional."
          fi

          echo "✓ Validação Android security concluída."

  # ═══════════════════════════════════════════════════════════════════════════
  # 7. DEPENDENCY SECURITY — OSV Scanner no pubspec.lock
  # ═══════════════════════════════════════════════════════════════════════════
  dependency_security:
    name: Dependency security — OSV Scanner (pubspec.lock)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache osv-scanner binary
        id: cache_osv
        uses: actions/cache@v4
        with:
          path: ~/.cache/osv-scanner/osv-scanner
          key: osv-scanner-${{ runner.os }}-${{ env.OSV_SCANNER_VERSION }}

      - name: Download osv-scanner (only on cache miss)
        if: steps.cache_osv.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/osv-scanner"
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/${{ env.OSV_SCANNER_VERSION }}/osv-scanner_linux_amd64" \
            -o "$HOME/.cache/osv-scanner/osv-scanner"
          chmod +x "$HOME/.cache/osv-scanner/osv-scanner"

      - name: Install osv-scanner from cache
        run: |
          set -euo pipefail
          sudo cp "$HOME/.cache/osv-scanner/osv-scanner" /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: OSV Scanner — dependências Dart/Flutter
        run: |
          osv-scanner --lockfile="$SERVICE_PATH/pubspec.lock"

  # ═══════════════════════════════════════════════════════════════════════════
  # 8. INTEGRATION TESTS (evolutivo — ativado automaticamente)
  # ═══════════════════════════════════════════════════════════════════════════
  integration_tests:
    name: Integration tests (evolutivo)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar existência de integration tests
        id: check
        run: |
          if [ -d "$SERVICE_PATH/integration_test" ] && \
             find "$SERVICE_PATH/integration_test" -name "*.dart" -print -quit | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "✓ integration_test/ encontrada — prosseguindo com execução."
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::integration_test/ não encontrada no projeto — job ignorado."
          fi

      - name: Set up Flutter
        if: steps.check.outputs.has_tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Hidratar firebase_options.dart (example / secret)
        if: steps.check.outputs.has_tests == 'true'
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: bash .github/scripts/hydrate-firebase-options.sh

      - name: Flutter — pub get
        if: steps.check.outputs.has_tests == 'true'
        working-directory: ${{ env.SERVICE_PATH }}
        run: flutter pub get

      - name: Flutter — integration tests
        if: steps.check.outputs.has_tests == 'true'
        working-directory: ${{ env.SERVICE_PATH }}
        run: flutter test integration_test/

  # ═══════════════════════════════════════════════════════════════════════════
  # 9. BUILD APK — APK assinado de release
  # ═══════════════════════════════════════════════════════════════════════════
  build_apk:
    name: Build APK — release assinado
    needs:
      - preflight
      - security_secrets
      - setup_validation
      - quality
      - tests
      - android_security
      - dependency_security
      - integration_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hidratar google-services.json a partir do secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 não configurado."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d \
            > "$SERVICE_PATH/android/app/google-services.json"
          jq empty "$SERVICE_PATH/android/app/google-services.json" \
            || { echo "::error::google-services.json hidratado é inválido."; exit 1; }
          echo "✓ google-services.json hidratado."

      - name: Hidratar firebase_options.dart a partir do secret
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          REQUIRE_SECRET: "1"
        run: bash .github/scripts/hydrate-firebase-options.sh

      - name: Hidratar keystore Android a partir do secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 não configurado."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d \
            > "$SERVICE_PATH/android/app/release.keystore"
          echo "✓ keystore hidratado em $SERVICE_PATH/android/app/release.keystore"

      - name: Gerar key.properties para assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret ANDROID_${var} não configurado."
              exit 1
            fi
          done
          cat > "$SERVICE_PATH/android/key.properties" <<EOF
          storeFile=release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "✓ key.properties gerado."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter — pub get
        working-directory: ${{ env.SERVICE_PATH }}
        run: flutter pub get

      - name: Cache Gradle project build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SERVICE_PATH }}/android/.gradle
            ${{ env.SERVICE_PATH }}/android/app/build
            ${{ env.SERVICE_PATH }}/build
          key: gradle-build-${{ runner.os }}-${{ hashFiles(format('{0}/android/**/*.gradle*', env.SERVICE_PATH), format('{0}/android/**/gradle-wrapper.properties', env.SERVICE_PATH), format('{0}/pubspec.lock', env.SERVICE_PATH)) }}
          restore-keys: |
            gradle-build-${{ runner.os }}-

      - name: Build APK (release, signed)
        working-directory: ${{ env.SERVICE_PATH }}
        run: flutter build apk --release

      - name: Renomear APK (nome rolling)
        run: |
          set -euo pipefail
          SRC="$SERVICE_PATH/build/app/outputs/flutter-apk/app-release.apk"
          DST="$SERVICE_PATH/build/app/outputs/flutter-apk/${{ env.APK_NAME }}"
          if [ ! -f "$SRC" ]; then
            echo "::error::APK não encontrado em $SRC."
            exit 1
          fi
          mv "$SRC" "$DST"
          echo "==> APK final: $DST ($(du -h "$DST" | cut -f1))"

      - name: Upload APK como workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SERVICE_PATH }}/build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: 30

      - name: Remover arquivos sensíveis hidratados
        if: always()
        run: |
          rm -f "$SERVICE_PATH/android/app/google-services.json"
          rm -f "$SERVICE_PATH/android/app/release.keystore"
          rm -f "$SERVICE_PATH/android/key.properties"

  # ═══════════════════════════════════════════════════════════════════════════
  # 10. PUBLISH — tag/release rolling + audit trail
  # ═══════════════════════════════════════════════════════════════════════════
  publish:
    name: Publish — tag mobile
    needs: [preflight, build_apk]
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Deployment record
        id: create_deployment
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg ref "${{ github.ref }}" \
            --arg environment "production" \
            --arg description "Deploy vigia-ui (Release + APK rolling)" \
            '{
              ref: $ref,
              environment: $environment,
              description: $description,
              auto_merge: false,
              required_contexts: []
            }')

          DEPLOYMENT_ID=$(printf '%s' "$PAYLOAD" | gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments" \
            --input - \
            --jq '.id')

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "✓ Deployment registrado: ID=$DEPLOYMENT_ID"

      - name: Mark deployment as in_progress
        env:
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="in_progress" \
            -f description="Publicando vigia-ui (Release + APK rolling)"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./apk

      - name: Move mutable tag to HEAD
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" -m "Vigia UI / Mobile (rolling)"
          git push origin "refs/tags/${TAG}" --force
          echo "✓ Tag '$TAG' apontada para $(git rev-parse --short HEAD)."

      - name: Reset GitHub Release (remove assets antigos)
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
            echo "✓ Release anterior '$TAG' removida (tag mantida)."
          else
            echo "Nenhuma release '$TAG' anterior."
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vigia UI / Mobile
          body: |
            Release rolling do **vigia_ui** (APK Android assinado).

            Cada execução desta pipeline sobrescreve esta release e a tag `mobile`.
            Não há versionamento SemVer no GitHub.

            ### Instalação
            Baixe o APK `vigia-ui-release.apk` listado abaixo e instale no dispositivo Android.

            ### Metadados
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Flutter: stable
            - Disparado por: ${{ github.actor }}
          files: |
            ./apk/${{ env.APK_NAME }}
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark deployment as success
        if: success()
        env:
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="success" \
            -f description="vigia-ui publicado (APK anexado à Release rolling mobile)"

      - name: Mark deployment as failure
        if: failure()
        env:
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="failure" \
            -f description="Publicação de vigia-ui falhou — verifique os logs"
