name: Solution Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────
  # 1. DETECÇÃO DE MUDANÇAS
  # Constrói uma matriz dinâmica com apenas os projetos
  # que tiveram arquivos alterados nesta PR.
  # ─────────────────────────────────────────────
  detect_changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      projects_matrix: ${{ steps.compute_matrix.outputs.projects_matrix }}
    steps:
      # shallow clone (fetch-depth: 1) impede o merge-base da PR; o paths-filter
      # então considera *todos* os arquivos como novos e aciona todos os filtros.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sem `token`, o paths-filter em pull_request usa git em vez da API; o diff local
      # costuma divergir do conjunto real de ficheiros da PR e pode marcar todos os filtros.
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          # "every": um ficheiro só conta se corresponder a *todos* os padrões do filtro
          # (ex.: path do projeto E não-*.md). "some" com '!' em linhas separadas trata
          # cada '!' como OR e dispara falsos positivos no repositório inteiro.
          # O quantificador é global: dockerfiles e ficheiros comuns ficam em filtros à parte.
          predicate-quantifier: every
          filters: |
            fall_detection_src:
              - 'fall-detection/**'
              - '!fall-detection/**/*.md'
            fall_detection_docker:
              - 'docker-compose/dockerfiles/fall-detection.dockerfile'
            vigia_api_src:
              - 'vigia-services/apps/vigia-api/**'
              - '!vigia-services/apps/vigia-api/**/*.md'
            vigia_api_docker:
              - 'docker-compose/dockerfiles/vigia-api.dockerfile'
            vigia_bootstrap_non_md:
              - 'vigia-services/apps/vigia-bootstrap/**'
              - '!vigia-services/apps/vigia-bootstrap/**/*.md'
            vigia_shared_non_md:
              - 'vigia-services/pkg/shared/**'
              - '!vigia-services/pkg/shared/**/*.md'
            vigia_go_work:
              - 'vigia-services/go.work'
            vigia_go_sum:
              - 'vigia-services/go.work.sum'
            vigia_makefile:
              - 'vigia-services/Makefile'
            vigia_ui_src:
              - 'vigia_ui/**'
              - '!vigia_ui/**/*.md'

      - name: Build projects matrix
        id: compute_matrix
        shell: bash
        run: |
          set -euo pipefail
          PROJECTS='[]'

          if [[ "${{ steps.filter.outputs.vigia_ui_src }}" == "true" ]]; then
            PROJECTS=$(jq -c '. + [{
              "name":       "vigia_ui",
              "type":       "flutter",
              "path":       "vigia_ui",
              "has_docker": "false"
            }]' <<< "$PROJECTS")
          fi

          if [[ "${{ steps.filter.outputs.fall_detection_src }}" == "true" || "${{ steps.filter.outputs.fall_detection_docker }}" == "true" ]]; then
            PROJECTS=$(jq -c '. + [{
              "name":       "fall-detection",
              "type":       "python",
              "path":       "fall-detection",
              "dockerfile": "docker-compose/dockerfiles/fall-detection.dockerfile",
              "has_docker": "true"
            }]' <<< "$PROJECTS")
          fi

          # Variáveis auxiliares para deixar as condições legíveis
          VIGIA_API_SRC="${{ steps.filter.outputs.vigia_api_src }}"
          VIGIA_API_DOCKER="${{ steps.filter.outputs.vigia_api_docker }}"
          VIGIA_BOOTSTRAP_CHANGED="${{ steps.filter.outputs.vigia_bootstrap_non_md }}"
          SHARED_CHANGED="${{ steps.filter.outputs.vigia_shared_non_md }}"
          GO_WORK_CHANGED="${{ steps.filter.outputs.vigia_go_work }}"
          GO_SUM_CHANGED="${{ steps.filter.outputs.vigia_go_sum }}"
          MAKEFILE_CHANGED="${{ steps.filter.outputs.vigia_makefile }}"

          # vigia-api entra se o próprio app, o pacote shared ou os arquivos
          # comuns do workspace Go foram alterados.
          if [[ "$VIGIA_API_SRC" == "true" || "$VIGIA_API_DOCKER" == "true" || "$SHARED_CHANGED" == "true" || "$GO_WORK_CHANGED" == "true" || "$GO_SUM_CHANGED" == "true" || "$MAKEFILE_CHANGED" == "true" ]]; then
            PROJECTS=$(jq -c '. + [{
              "name":       "vigia-api",
              "type":       "go",
              "path":       "vigia-services/apps/vigia-api",
              "go_mod":     "vigia-services/apps/vigia-api/go.mod",
              "go_sum":     "vigia-services/apps/vigia-api/go.sum",
              "dockerfile": "docker-compose/dockerfiles/vigia-api.dockerfile",
              "has_docker": "true"
            }]' <<< "$PROJECTS")
          fi

          if [[ "$VIGIA_BOOTSTRAP_CHANGED" == "true" || "$SHARED_CHANGED" == "true" || "$GO_WORK_CHANGED" == "true" || "$GO_SUM_CHANGED" == "true" || "$MAKEFILE_CHANGED" == "true" ]]; then
            PROJECTS=$(jq -c '. + [{
              "name":       "vigia-bootstrap",
              "type":       "go",
              "path":       "vigia-services/apps/vigia-bootstrap",
              "go_mod":     "vigia-services/apps/vigia-bootstrap/go.mod",
              "go_sum":     "vigia-services/apps/vigia-bootstrap/go.sum",
              "has_docker": "false"
            }]' <<< "$PROJECTS")
          fi

          echo "projects_matrix=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "Projetos detectados: $PROJECTS"

  # ─────────────────────────────────────────────
  # 2. SCAN DE SEGREDOS
  # Roda sempre, independente de quais projetos
  # foram alterados — segredos podem aparecer em
  # qualquer arquivo do repositório.
  # ─────────────────────────────────────────────
  secrets_scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 3. QUALIDADE POR PROJETO
  # Roda em paralelo para cada projeto detectado.
  # fail-fast: false garante que todos os projetos
  # sejam verificados mesmo se um falhar.
  # ─────────────────────────────────────────────
  project_quality:
    name: "${{ matrix.project.name }} — checks"
    needs: detect_changes
    if: needs.detect_changes.outputs.projects_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect_changes.outputs.projects_matrix) }}
    steps:
      - uses: actions/checkout@v4

      # ── Setup de runtime por linguagem ──────────────────────

      - name: Set up Python
        if: matrix.project.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            ${{ matrix.project.path }}/requirements.txt
            ${{ matrix.project.path }}/requirements-debug.txt

      - name: Set up Go
        if: matrix.project.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.project.go_mod }}
          cache-dependency-path: ${{ matrix.project.go_sum }}

      - name: Set up Flutter
        if: matrix.project.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Python ──────────────────────────────────────────────

      - name: Python - install dependencies
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Mantemos compatibilidade com o workflow de deploy:
          # não instalamos requirements-debug.txt aqui para evitar
          # conflito pytest==9.x vs pytest-asyncio<9.
          python -m pip install \
            "pylint>=3,<4" \
            "bandit>=1.8,<2" \
            "pip-audit>=2.9,<3" \
            "pytest>=8.2,<9" \
            "pytest-asyncio>=0.26,<0.27"

      - name: Python - lint
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        run: python -m pylint src/app

      - name: Python - SAST
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        # -ll = reporta apenas issues de severidade MEDIUM ou acima
        run: python -m bandit -r src/app -ll

      - name: Python - dependency vulnerabilities
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        # Temporarily ignored vulnerabilities:
        # - CVE-2026-3219 (pip): no fixed version available in index yet.
        # - CVE-2025-71176 (pytest): fixed in pytest 9, but current async test stack
        #   depends on pytest-asyncio which constrains pytest<9.
        # Sem --strict: torch (+cpu, índice PyTorch) não é auditável como pacote PyPI puro.
        run: |
          python -m pip_audit \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2025-71176

      - name: Python - tests
        if: matrix.project.type == 'python'
        working-directory: ${{ matrix.project.path }}
        run: python -m pytest -q

      # ── Flutter (vigia_ui) ────────────────────────────────────

      - name: Flutter - pub get
        if: matrix.project.type == 'flutter'
        working-directory: ${{ matrix.project.path }}
        run: flutter pub get

      - name: Flutter - format (obrigatório)
        if: matrix.project.type == 'flutter'
        working-directory: ${{ matrix.project.path }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter - analyze
        if: matrix.project.type == 'flutter'
        working-directory: ${{ matrix.project.path }}
        run: flutter analyze --fatal-warnings

      - name: Flutter - test
        if: matrix.project.type == 'flutter'
        working-directory: ${{ matrix.project.path }}
        run: flutter test

      # ── Go ──────────────────────────────────────────────────

      - name: Go - install security tools
        if: matrix.project.type == 'go'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Go - lint
        if: matrix.project.type == 'go'
        working-directory: ${{ matrix.project.path }}
        run: golangci-lint run --timeout=5m

      - name: Go - SAST
        if: matrix.project.type == 'go'
        working-directory: ${{ matrix.project.path }}
        run: gosec ./...

      - name: Go - dependency vulnerabilities
        if: matrix.project.type == 'go'
        working-directory: ${{ matrix.project.path }}
        run: govulncheck ./...

      - name: Go - tests with coverage
        if: matrix.project.type == 'go'
        working-directory: ${{ matrix.project.path }}
        run: |
          go test ./... \
            -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout=120s

      - name: Go - export coverage report
        if: matrix.project.type == 'go'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project.name }}
          path: ${{ matrix.project.path }}/coverage.out
          retention-days: 7

      # ── Dockerfile (qualquer linguagem que tenha imagem) ────

      - name: Dockerfile lint
        if: matrix.project.has_docker == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.project.dockerfile }}
          failure-threshold: error

  # ─────────────────────────────────────────────
  # 4. CI GATE
  # Job único que consolida o resultado de todos
  # os outros. Configure APENAS este job como
  # "required status check" no branch protection.
  #
  # Por que um gate separado?
  # O GitHub trata jobs pulados (skipped) como
  # aprovados em required checks — sem o gate,
  # uma PR que não altera nenhum projeto mapeado
  # passa o CI sem nenhuma validação real.
  # ─────────────────────────────────────────────
  ci_gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [secrets_scan, project_quality]
    # always() garante que o gate roda mesmo quando
    # project_quality foi pulado (matriz vazia).
    if: always()
    steps:
      - name: Avaliar resultado geral
        run: |
          SECRETS="${{ needs.secrets_scan.result }}"
          QUALITY="${{ needs.project_quality.result }}"

          echo "secrets_scan    : $SECRETS"
          echo "project_quality : $QUALITY"

          if [[ "$SECRETS" == "failure" || "$SECRETS" == "cancelled" ]]; then
            echo "::error::Secret scan falhou ou foi cancelado."
            exit 1
          fi

          if [[ "$QUALITY" == "failure" || "$QUALITY" == "cancelled" ]]; then
            echo "::error::Um ou mais projetos falharam nos checks de qualidade."
            exit 1
          fi

          # "skipped" acontece quando nenhum projeto foi detectado
          # (só arquivos não mapeados foram alterados). Consideramos válido.
          # Para bloquear esse caso, troque a condição acima por:
          #   "$QUALITY" == "failure" || "$QUALITY" == "cancelled" || "$QUALITY" == "skipped"
          echo "CI concluído com sucesso."