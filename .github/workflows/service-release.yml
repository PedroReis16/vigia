name: Vigia API — Service Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a ser publicada (ex.: 1.0.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

run-name: "Vigia API — release v${{ inputs.version }}"

permissions:
  contents: write
  security-events: write
  deployments: write

env:
  SERVICE_PATH: vigia-api
  DOCKERFILE_PATH: docker-compose/dockerfiles/vigia-api.dockerfile
  IMAGE_NAME: vigia-api
  DOTNET_VERSION: "10.0.x"

jobs:
  #------------------------------------------
  # 1. Validate project
  #------------------------------------------
  validate-project:
    uses: ./.github/workflows/validate-project.yml
    with:
      project: api
      version: ${{ inputs.version }}

  #------------------------------------------
  # 2. Test (.NET)
  #------------------------------------------
  test:
    name: Tests — unit & integration
    needs: validate-project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Vigia.slnx

      - name: Build
        run: dotnet build Vigia.slnx -c Release --no-restore

      - name: Test
        run: |
          set -euo pipefail
          dotnet test Vigia.slnx \
            -c Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-vigia-api-${{ inputs.version }}
          path: ${{ env.SERVICE_PATH }}/TestResults
          retention-days: 7
          if-no-files-found: ignore

  #------------------------------------------
  # 3. Security (secrets + Dockerfile)
  #------------------------------------------
  security:
    name: Security — secrets & Dockerfile
    needs: validate-project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.DOCKERFILE_PATH }}
          failure-threshold: error

  #------------------------------------------
  # 4. Publish — Docker image
  #------------------------------------------
  publish:
    name: Publish — Docker Hub
    needs: [validate-project, test, security]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        env:
          IS_HOMOLOG: ${{ needs.validate-project.outputs.is_homolog }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$IS_HOMOLOG" == "true" ]]; then
            IMAGE_TAG="hom-${VERSION}"
          else
            IMAGE_TAG="${VERSION}"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag da imagem: ${IMAGE_TAG}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (local, pre-scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VERSION=${{ inputs.version }}

      - name: Trivy — generate SARIF report
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy — block on unfixed CRITICAL/HIGH CVEs
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: table
          ignore-unfixed: true

      - name: Push Docker image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IS_HOMOLOG: ${{ needs.validate-project.outputs.is_homolog }}
        run: |
          set -euo pipefail
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          IMAGE="${USERNAME}/${{ env.IMAGE_NAME }}"

          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${{ github.sha }}"

          # `latest` só em release de produção (branch master).
          if [[ "$IS_HOMOLOG" != "true" ]]; then
            docker tag "${IMAGE}:${IMAGE_TAG}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
            echo "✓ Imagens publicadas: ${IMAGE_TAG}, ${{ github.sha }}, latest"
          else
            echo "✓ Imagens publicadas (homolog): ${IMAGE_TAG}, ${{ github.sha }}"
          fi

  #------------------------------------------
  # 5. Portainer deploy — production only
  #------------------------------------------
  portainer_deploy:
    name: Deploy — Portainer webhook
    needs: [validate-project, publish]
    if: needs.validate-project.outputs.is_homolog != 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Portainer stack redeploy
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          WEBHOOK_URL=$(echo "$WEBHOOK_URL" | tr -d '[:space:]')
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Secret PORTAINER_WEBHOOK_URL não configurado."
            exit 1
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL")
          if [[ "$HTTP_STATUS" != "200" && "$HTTP_STATUS" != "204" ]]; then
            echo "::error::Portainer webhook falhou com HTTP ${HTTP_STATUS}."
            exit 1
          fi
          echo "✓ Portainer redeploy acionado — vigia-api v${{ inputs.version }} (HTTP ${HTTP_STATUS})."

  #------------------------------------------
  # 6. Release — git tag
  #------------------------------------------
  release:
    name: Release — tag
    needs: [validate-project, publish, portainer_deploy]
    # Homolog: portainer é skipped; produção: exige deploy ok.
    if: |
      always() &&
      needs.validate-project.result == 'success' &&
      needs.publish.result == 'success' &&
      (needs.portainer_deploy.result == 'success' || needs.portainer_deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push git tag
        env:
          TAG: ${{ needs.validate-project.outputs.tag_name }}
          IS_HOMOLOG: ${{ needs.validate-project.outputs.is_homolog }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "$IS_HOMOLOG" == "true" ]]; then
            MSG="Homolog Vigia API v${{ inputs.version }}"
          else
            MSG="Release Vigia API v${{ inputs.version }}"
          fi

          git tag -a "$TAG" -m "$MSG"
          git push origin "$TAG"
          echo "✓ Tag '$TAG' criada e publicada."

  #------------------------------------------
  # 7. Deployment audit (produção)
  #------------------------------------------
  deployment_audit:
    name: Deployment audit — GitHub Deployment
    needs: [validate-project, portainer_deploy, release]
    if: |
      always() &&
      needs.validate-project.outputs.is_homolog != 'true' &&
      needs.portainer_deploy.result == 'success' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create GitHub Deployment record
        id: create_deployment
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg ref "${{ github.ref }}" \
            --arg environment "production" \
            --arg description "Deploy vigia-api v${{ inputs.version }}" \
            '{
              ref: $ref,
              environment: $environment,
              description: $description,
              auto_merge: false,
              required_contexts: []
            }')

          DEPLOYMENT_ID=$(printf '%s' "$PAYLOAD" | gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments" \
            --input - \
            --jq '.id')

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "✓ Deployment registrado: ID=$DEPLOYMENT_ID"

      - name: Mark deployment as success
        env:
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="success" \
            -f description="vigia-api v${{ inputs.version }} em produção"
