logLevel: info

# Control API used by on_unread hook to count remaining readers (localhost only).
api: yes
apiAddress: :9997

# Protocolos habilitados para teste de latencia
rtsp: yes
rtmp: yes
hls: yes
webrtc: yes

# Em Docker local (macOS), anunciar hosts explicitos evita candidatos ICE invalidos.
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts:
  - localhost
  - 127.0.0.1
  - host.docker.internal

# Porta fixa de mídia WebRTC (precisa estar publicada no host)
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189

# Parametros com foco em baixa latencia no HLS (LL-HLS)
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 6

paths:
  # Device RTMP publish: rtmp://…/live/{deviceId}
  # $G1 = device UUID capturado do path
  # NOTE: runOnUnDemand only runs in the runOnDemand lifecycle (HasOnDemandPublisher
  # requires runOnDemand). Devices publish RTMP themselves, so use runOnUnread +
  # Control API reader check (see /hooks/on_unread_stop_streaming.sh).
  "~^live/([0-9a-fA-F-]+)$":
    source: publisher
    runOnUnread: sh /hooks/on_unread_stop_streaming.sh
  all:
    source: publisher
