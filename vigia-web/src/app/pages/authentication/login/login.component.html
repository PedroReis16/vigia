<div class="flex min-h-full items-center justify-center p-4">
  <div class="flex w-full max-w-md flex-col gap-4">
    <app-message />
    <p-card>
      <ng-template #header>
        <div class="px-6 pt-6">
          <h1 class="text-2xl font-semibold">{{ 'AUTH.LOGIN.TITLE' | translate }}</h1>
          <p class="mt-1 text-sm opacity-80">{{ 'AUTH.LOGIN.SUBTITLE' | translate }}</p>
        </div>
      </ng-template>

      <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="onSubmit()">
        <app-input
          id="login-email"
          type="text"
          label="AUTH.FIELDS.EMAIL"
          [control]="emailControl"
          [formControl]="emailControl"
        />
        <app-input
          id="login-password"
          type="password"
          label="AUTH.FIELDS.PASSWORD"
          [control]="passwordControl"
          [formControl]="passwordControl"
        />

        <p-button
          type="submit"
          styleClass="w-full"
          [label]="'AUTH.LOGIN.SUBMIT' | translate"
          [loading]="submitting()"
          [disabled]="form.invalid || submitting()"
        />
      </form>

      <ng-template #footer>
        <p class="px-2 pb-2 text-center text-sm">
          {{ 'AUTH.LOGIN.NO_ACCOUNT' | translate }}
          <a routerLink="/register" class="font-medium underline">
            {{ 'AUTH.LOGIN.GO_REGISTER' | translate }}
          </a>
        </p>
      </ng-template>
    </p-card>
  </div>
</div>
