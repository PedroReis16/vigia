name: vigia_ui
description: "Cuidar de quem você ama, nunca foi tão fácil"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  dio: ^5.10.0
  uuid: ^4.6.0
  video_player: ^2.13.0
  flutter_blue_plus: ^2.3.10
  permission_handler: ^12.0.3
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.1

  # Local fork with Swift Package Manager support (upstream lacks Package.swift).
  wifi_scan:
    path: packages/wifi_scan
  rxdart: ^0.28.0
  skeletonizer: ^2.1.3
  flutter_dotenv: ^6.0.1
  jwt_decoder: ^2.0.1
  app_links: ^6.4.0
  share_plus: ^10.1.4
  signalr_netcore: ^1.4.4
  flutter_webrtc: ^1.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/vigia_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/vigia_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/videos/
    - homolog.env