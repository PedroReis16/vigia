basePath: /
definitions:
  github_com_PedroReis16_vigia_vigia-services_apps_vigia-api_internal_models_dtos.VersionDTO:
    properties:
      download_url:
        type: string
      version:
        type: string
    type: object
  internal_http_handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  internal_http_handlers.HealthCheckResponse:
    properties:
      message:
        type: string
    type: object
  internal_http_handlers.MessageResponse:
    properties:
      message:
        type: string
    type: object
host: localhost:8000
info:
  contact: {}
  description: API do Vigia Services.
  title: Vigia API
  version: "1.0"
paths:
  /health:
    get:
      description: Verifica se a API está em execução.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.HealthCheckResponse'
      summary: Health check
      tags:
      - health
  /v1/devices/:
    get:
      description: Retorna a lista de dispositivos cadastrados para o usuário autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.ErrorResponse'
      summary: Listar dispositivos do usuário
      tags:
      - devices
  /v1/devices/register:
    post:
      consumes:
      - application/json
      description: Vincula um dispositivo a um usuário autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.ErrorResponse'
      summary: Registrar dispositivo do usuário
      tags:
      - devices
  /v1/devices/version/{version}/download:
    get:
      description: Retorna a URL de download pré-assinada para a versão informada.
      parameters:
      - description: Versão alvo (semver)
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PedroReis16_vigia_vigia-services_apps_vigia-api_internal_models_dtos.VersionDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.ErrorResponse'
      summary: Obter metadados de uma versão
      tags:
      - versions
  /v1/devices/version/find-for-updates:
    get:
      description: Retorna metadados da versão mais recente publicada. Quando `currentVersion`
        é informada via query, responde 204 caso o dispositivo já esteja na versão
        mais recente.
      parameters:
      - description: Versão atualmente instalada no dispositivo (semver)
        in: query
        name: currentVersion
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PedroReis16_vigia_vigia-services_apps_vigia-api_internal_models_dtos.VersionDTO'
        "204":
          description: Dispositivo já está na versão mais recente
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.ErrorResponse'
      summary: Buscar atualização disponível
      tags:
      - versions
  /v1/devices/version/register:
    post:
      consumes:
      - multipart/form-data
      description: Faz upload de um bundle do agente fall-detection e registra uma
        nova versão no catálogo.
      parameters:
      - description: 'Identificador semântico da versão (ex.: 1.2.3)'
        in: formData
        name: version
        required: true
        type: string
      - description: Bundle compactado da versão
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_http_handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.ErrorResponse'
      summary: Registrar nova versão do Vigia
      tags:
      - versions
swagger: "2.0"
