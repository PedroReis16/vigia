name: Vigia - Onboard Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão"
        required: true
        type: string

jobs:
  #------------------------------------------
  # 1. Validate project
  #------------------------------------------
  validate-project:
    uses: ./.github/workflows/validate-project.yml
    with:
      project: onboard
      version: ${{ inputs.version }}
