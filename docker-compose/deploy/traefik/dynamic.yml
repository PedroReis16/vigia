tls:
  options:
    device-mtls:
      clientAuth:
        caFiles:
          - /certificates/vigia-device-ca.crt
        clientAuthType: RequireAndVerifyClientCert

http:
  middlewares:
    pass-device-cert:
      passTLSClientCert:
        pem: true
    cors:
      headers:
        accessControlAllowOriginList:
          - "*"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "*"
        accessControlMaxAge: 600