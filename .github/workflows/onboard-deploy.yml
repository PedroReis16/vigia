name: Onboard Deploy

# Impede dois deploys simultâneos (Fall Detection / onboard)
concurrency:
  group: deploy-vigia-fall-detection-${{ inputs.version }}
  cancel-in-progress: false # false = espera o anterior terminar, não cancela

run-name: "Vigia Fall Detection — v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────
  # 1. VALIDAÇÃO — equivalente a "Vigia Fall Detection" em services-deploy.yml
  # ─────────────────────────────────────────────
  validate_environment:
    name: Validate environment
    runs-on: ubuntu-latest
    outputs:
      service_slug: ${{ steps.service_vars.outputs.service_slug }}
      service_path: ${{ steps.service_vars.outputs.service_path }}
      artifact_name: ${{ steps.service_vars.outputs.artifact_name }}
      tag_name: ${{ steps.release_vars.outputs.tag_name }}
      runner_label: ${{ steps.runner_pick.outputs.runner_label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve service variables (Fall Detection)
        id: service_vars
        shell: bash
        run: |
          set -euo pipefail
          echo "service_slug=vigia-fall-detection" >> "$GITHUB_OUTPUT"
          echo "service_path=fall-detection" >> "$GITHUB_OUTPUT"
          echo "image_name=" >> "$GITHUB_OUTPUT"
          echo "artifact_name=fall-detection" >> "$GITHUB_OUTPUT"

      # Binário alvo é linux/arm64 — runner ARM nativo (ubuntu-24.04-arm).
      - name: Resolver runner (ARM64)
        id: runner_pick
        shell: bash
        run: echo "runner_label=ubuntu-24.04-arm" >> "$GITHUB_OUTPUT"

      - name: Definir variáveis de release
        id: release_vars
        shell: bash
        run: |
          TAG_NAME="vigia-fall-detection@${{ inputs.version }}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Tag de release: $TAG_NAME"

      - name: Validar CHANGELOG
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          SERVICE_PATH="${{ steps.service_vars.outputs.service_path }}"
          CHANGELOG_PATH="./${SERVICE_PATH}/CHANGELOG.md"

          echo "Verificando versão '$VERSION' em '$CHANGELOG_PATH'..."

          if [ ! -f "$CHANGELOG_PATH" ]; then
            echo "::error::Arquivo $CHANGELOG_PATH não encontrado."
            echo "Crie o CHANGELOG.md em '$SERVICE_PATH' antes de fazer o release."
            exit 1
          fi

          if grep -qE "^#{1,2} \*?\*?\[${VERSION}\]" "$CHANGELOG_PATH"; then
            echo "✓ Versão $VERSION encontrada no CHANGELOG."
          else
            echo "::error::Versão $VERSION NÃO encontrada em $CHANGELOG_PATH."
            echo "Adicione a seção '## [$VERSION]' ao CHANGELOG antes do release."
            exit 1
          fi

      - name: Validar unicidade da tag de release
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.release_vars.outputs.tag_name }}"
          echo "Verificando se a tag '$TAG_NAME' já existe..."
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::A tag '$TAG_NAME' já existe no repositório."
            echo "Use uma versão diferente ou delete a tag existente manualmente."
            exit 1
          fi
          echo "✓ Tag '$TAG_NAME' está disponível."

  # ─────────────────────────────────────────────
  # 2. SEGURANÇA — Python (Fall Detection)
  # ─────────────────────────────────────────────
  security:
    name: Segurança — SAST, SCA, secrets
    needs: validate_environment
    runs-on: ${{ needs.validate_environment.outputs.runner_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ${{ needs.validate_environment.outputs.service_path }}/requirements-common.txt
            ${{ needs.validate_environment.outputs.service_path }}/requirements-headless.txt
            ${{ needs.validate_environment.outputs.service_path }}/requirements-binary.txt
            ${{ needs.validate_environment.outputs.service_path }}/pyproject.toml

      - name: Install system deps (equiv. Dockerfile.linux-arm64-binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ffmpeg \
            libglib2.0-0 \
            libgomp1 \
            libgl1 \
            libsm6 \
            libxext6

      - name: Python - install dependencies (equiv. Makefile / Docker build)
        working-directory: ${{ needs.validate_environment.outputs.service_path }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch>=2.6,<2.12" "torchvision>=0.21,<0.27"
          python -m pip install -r requirements-headless.txt
          python -m pip install -r requirements-binary.txt
          python -m pip install -e .
          python -m pip uninstall -y opencv-python 2>/dev/null || true
          python -m pip install --force-reinstall "opencv-python-headless==4.12.0.88"
          python -m pip install \
            "pylint>=3,<4" \
            "bandit>=1.8,<2" \
            "pip-audit>=2.9,<3" \
            "pytest>=8.2,<9" \
            "pytest-asyncio>=0.26,<0.27"

      - name: Python - lint (pylint)
        working-directory: ${{ needs.validate_environment.outputs.service_path }}
        run: python -m pylint src/app

      - name: Python - SAST (bandit)
        working-directory: ${{ needs.validate_environment.outputs.service_path }}
        run: python -m bandit -r src/app -ll

      - name: Python - dependency vulnerabilities (pip-audit)
        working-directory: ${{ needs.validate_environment.outputs.service_path }}
        run: |
          python -m pip_audit \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2025-71176

      - name: Python - tests (pytest)
        working-directory: ${{ needs.validate_environment.outputs.service_path }}
        run: python -m pytest -q

  # ─────────────────────────────────────────────
  # 3. BUILD — make build-linux-arm64 + tarball
  # ─────────────────────────────────────────────
  build:
    name: Build — Vigia Fall Detection
    needs:
      - validate_environment
      - security
    runs-on: ${{ needs.validate_environment.outputs.runner_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fall Detection — make build-linux-arm64
        working-directory: ${{ needs.validate_environment.outputs.service_path }}
        run: make build-linux-arm64

      - name: Fall Detection — preparar tarball para artefacto / GitHub Release
        working-directory: ${{ needs.validate_environment.outputs.service_path }}
        run: |
          set -euo pipefail
          test -f dist/vigia-fall-detection-linux-arm64.tar.gz
          cp dist/vigia-fall-detection-linux-arm64.tar.gz \
            "${{ github.workspace }}/vigia-fall-detection-linux-arm64-${{ inputs.version }}.tar.gz"
          ls -la "${{ github.workspace }}/vigia-fall-detection-linux-arm64-${{ inputs.version }}.tar.gz"

      - name: Fall Detection — exportar artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ needs.validate_environment.outputs.artifact_name }}-${{ inputs.version }}
          path: vigia-fall-detection-linux-arm64-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4. TAG + GitHub Release (sem Docker / sem deploy VM)
  # ─────────────────────────────────────────────
  tag_release:
    name: Criar tag de release
    needs:
      - validate_environment
      - security
      - build
    if: |
      always() &&
      needs.validate_environment.result == 'success' &&
      needs.security.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar artefato Fall Detection (Linux ARM64)
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.validate_environment.outputs.artifact_name }}-${{ inputs.version }}
          path: ./release-assets

      - name: Confirmar tarball Fall Detection para anexar ao release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          EXPECT="./release-assets/vigia-fall-detection-linux-arm64-${VERSION}.tar.gz"
          if [ -f "$EXPECT" ]; then
            ls -la "$EXPECT"
            exit 0
          fi
          FOUND="$(find release-assets -type f -name 'vigia-fall-detection-linux-arm64-*.tar.gz' -print -quit || true)"
          if [ -z "${FOUND}" ]; then
            echo "::error::Tarball Fall Detection não encontrado em release-assets."
            find release-assets -ls 2>/dev/null || ls -la release-assets || true
            exit 1
          fi
          cp -f "$FOUND" "$EXPECT"
          ls -la "$EXPECT"

      - name: Criar e publicar tag
        env:
          TAG_NAME: ${{ needs.validate_environment.outputs.tag_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" \
            -m "Release Vigia Fall Detection v${{ inputs.version }} → production"

          git push origin "$TAG_NAME"

          echo "✓ Tag '$TAG_NAME' criada e publicada."

      - name: Extrair release notes do CHANGELOG
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SERVICE_PATH: ${{ needs.validate_environment.outputs.service_path }}
        run: |
          set -euo pipefail

          CHANGELOG_PATH="./${SERVICE_PATH}/CHANGELOG.md"
          echo "Extraindo changelog para versão: $VERSION de $CHANGELOG_PATH"

          if [ ! -f "$CHANGELOG_PATH" ]; then
            echo "::error::Arquivo $CHANGELOG_PATH não encontrado."
            exit 1
          fi

          awk -v version="$VERSION" '
            $0 ~ /^#{1,2}[[:space:]]+/ && index($0, "[" version "]") > 0 { capture=1; next }
            capture && $0 ~ /^#{1,2}[[:space:]]+\*?\*?\[[^]]+\]\*?\*?([[:space:]].*)?$/ { exit }
            capture { print }
          ' "$CHANGELOG_PATH" > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::Nao foi possivel extrair release notes para versao $VERSION em $CHANGELOG_PATH."
            exit 1
          fi

          echo "Release notes extraidas com sucesso."

      - name: Criar GitHub Release (Fall Detection — Linux ARM64)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate_environment.outputs.tag_name }}
          body_path: ./RELEASE_NOTES.md
          files: ./release-assets/vigia-fall-detection-linux-arm64-${{ inputs.version }}.tar.gz
          draft: false
          generate_release_notes: false
          skip_duplicate: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
