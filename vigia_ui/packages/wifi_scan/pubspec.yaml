name: wifi_scan
description: Flutter plugin to scan for nearby visible WiFi access points.
version: 0.4.1+2
homepage: https://github.com/flutternetwork/WiFiFlutter/tree/master/packages/wifi_scan
publish_to: "none"

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutternetwork.wifi.wifi_scan
        pluginClass: WifiScanPlugin
      ios:
        pluginClass: WifiScanPlugin
