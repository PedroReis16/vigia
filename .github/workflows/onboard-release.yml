name: Vigia - Onboard Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

run-name: "Onboard Release - ${{ inputs.version }}"

permissions:
  contents: write

env:
  SERVICE_PATH: vigia-fall
  APP_NAME: vigia-fall-detection

jobs:
  #------------------------------------------
  # 1. Validate project
  #------------------------------------------
  validate-project:
    uses: ./.github/workflows/validate-project.yml
    with:
      project: onboard
      version: ${{ inputs.version }}

  #------------------------------------------
  # 2. Build release (Linux ARM64 nativo)
  #------------------------------------------
  build-release:
    name: Build - Linux ARM64
    needs: validate-project
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ffmpeg \
            libglib2.0-0 \
            libgomp1 \
            libgl1 \
            libsm6 \
            libxext6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip + YOLO model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ env.SERVICE_PATH }}/yolo26s-pose.pt
          key: fall-arm64-${{ hashFiles(format('{0}/requirements.txt', env.SERVICE_PATH), format('{0}/requirements-build.txt', env.SERVICE_PATH)) }}
          restore-keys: |
            fall-arm64-

      - name: Install Python build dependencies
        run: make install-build-deps

      - name: Build Linux ARM64 bundle (native)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "Host: $(uname -s)/$(uname -m)"
          make build-linux-arm64

      - name: Package OTA bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          make package-ota

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/release-assets"
          cp "dist/vigia-fall-ota-${{ inputs.version }}.tar.gz" \
             "dist/${{ env.APP_NAME }}-linux-arm64.tar.gz" \
             deploy/install.sh \
             deploy/uninstall.sh \
             deploy/fall-detection.service \
             "${{ github.workspace }}/release-assets/"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-arm64-${{ inputs.version }}
          path: ${{ github.workspace }}/release-assets/*
          retention-days: 30

  #------------------------------------------
  # 3. Release
  #------------------------------------------
  release:
    name: Release — tag & upload version
    needs: [validate-project, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-arm64-${{ inputs.version }}
          path: ./artifacts

      - name: Create and push git tag
        run: |
          set -euo pipefail
          TAG="${{ needs.validate-project.outputs.tag_name }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" \
            -m "Release Vigia Onboard (fall-detection) v${{ inputs.version }}"
          git push origin "$TAG"
          echo "✓ Tag '$TAG' criada e publicada."

      - name: Upload device version to Vigia API
        env:
          VIGIA_API_BASE_URL: ${{ secrets.VIGIA_API_BASE_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${VIGIA_API_BASE_URL:-}" ]; then
            echo "::error::Secret VIGIA_API_BASE_URL não configurado."
            exit 1
          fi

          BASE_URL="${VIGIA_API_BASE_URL%/}"
          ARTIFACT="./artifacts/vigia-fall-ota-${VERSION}.tar.gz"
          if [ ! -f "$ARTIFACT" ]; then
            echo "::error::Artefato OTA não encontrado: $ARTIFACT"
            ls -la ./artifacts || true
            exit 1
          fi

          FILE_ID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          CHUNK_SIZE=5242880
          CHUNK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHUNK_DIR"' EXIT

          split -b "$CHUNK_SIZE" -d -a 5 "$ARTIFACT" "$CHUNK_DIR/chunk_"
          mapfile -t CHUNKS < <(ls -1 "$CHUNK_DIR"/chunk_* | sort)
          TOTAL_CHUNKS="${#CHUNKS[@]}"

          if [ "$TOTAL_CHUNKS" -eq 0 ]; then
            echo "::error::Nenhum chunk gerado a partir de $ARTIFACT"
            exit 1
          fi

          echo "Enviando $ARTIFACT ($TOTAL_CHUNKS chunks de até 5 MiB) para ${BASE_URL}/devices/versions"
          echo "fileId=$FILE_ID version=$VERSION"

          for i in "${!CHUNKS[@]}"; do
            CHUNK_PATH="${CHUNKS[$i]}"
            echo "→ Chunk $((i + 1))/$TOTAL_CHUNKS"
            curl -fsS -X POST "${BASE_URL}/devices/versions" \
              -F "fileChunk=@${CHUNK_PATH};type=application/octet-stream" \
              -F "version=${VERSION}" \
              -F "fileId=${FILE_ID}" \
              -F "chunkIndex=${i}" \
              -F "totalChunks=${TOTAL_CHUNKS}"
            echo
          done

          echo "✓ Versão OTA $VERSION enviada com sucesso."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-project.outputs.tag_name }}
          name: "Vigia Onboard v${{ inputs.version }}"
          files: |
            ./artifacts/vigia-fall-ota-${{ inputs.version }}.tar.gz
            ./artifacts/${{ env.APP_NAME }}-linux-arm64.tar.gz
            ./artifacts/install.sh
            ./artifacts/uninstall.sh
            ./artifacts/fall-detection.service
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
